<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stjärnklickaren</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-card">
    <div class="stars" aria-hidden="true">🌟 🚀 ✨</div>
    <h1>Stjärnklickaren</h1>
    <p class="instructions">Klicka på knappen och samla så många stjärnpoäng du kan!</p>
    <section class="score-board" aria-live="polite">
      <span class="score-label">Poäng</span>
      <span id="workshop-game-score">0</span>
    </section>
    <button id="workshop-game-click">Click me</button>
    <p id="message">Redo, kodare?</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
