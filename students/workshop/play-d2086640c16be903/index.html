<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stjärnjakten</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-card">
    <div class="stars" aria-hidden="true">✨ ⭐ 🚀</div>
    <h1>Stjärnjakten!</h1>
    <p class="mission">Klicka på stjärnan och samla så många poäng du kan!</p>
    <p class="score-board">Poäng: <span id="workshop-game-score">0</span></p>
    <button id="workshop-game-click">Click me</button>
    <p id="message" aria-live="polite">Redo, kodare?</p>
    <button id="reset-button" type="button">Börja om 🔄</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
