<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloweenboken</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #1e1033;
      color: #f5e6c8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-sizing: border-box;
      text-align: center;
    }
    h1 { color: #ff8c1a; margin: 0 0 0.5rem; font-size: clamp(1.6rem, 4vw, 2.4rem); }
    .book {
      width: min(100%, 52rem);
      background: #2a1845;
      border: 4px solid #ff8c1a;
      border-radius: 16px;
      padding: 1rem;
      box-sizing: border-box;
    }
    svg { width: 100%; height: auto; display: block; }
    #text { min-height: 3.5em; font-size: clamp(1rem, 2.5vw, 1.25rem); line-height: 1.5; margin: 0.75rem 0; }
    button {
      font-size: 1.1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 10px;
      background: #ff8c1a;
      color: #1e1033;
      cursor: pointer;
      min-height: 44px;
      touch-action: manipulation;
    }
    .back { display: inline-block; margin-top: 1rem; color: #b8a6d9; }
  </style>
</head>
<body>
  <h1>Halloweenboken 🎃</h1>
  <div class="book">
    <svg viewBox="0 0 400 260" role="img" aria-label="Ett spökhus och två barn">
      <rect width="400" height="260" fill="#120a24"/>
      <circle cx="330" cy="50" r="22" fill="#f5e6c8" opacity="0.8"/>
      <!-- haunted house -->
      <polygon points="90,110 200,40 310,110" fill="#3b2a5c"/>
      <rect x="110" y="110" width="180" height="120" fill="#4a3570"/>
      <rect x="180" y="170" width="40" height="60" fill="#1e1033"/>
      <rect x="130" y="135" width="30" height="30" fill="#ffd166" id="win1"/>
      <rect x="240" y="135" width="30" height="30" fill="#ffd166" id="win2"/>
      <!-- ghost -->
      <g id="ghost">
        <path d="M 300 180 q 0 -30 20 -30 q 20 0 20 30 v 30 l -6 -6 l -6 6 l -4 -6 l -4 6 l -6 -6 l -6 6 z" fill="#f5f5f5" opacity="0.9"/>
        <circle cx="312" cy="170" r="3" fill="#1e1033"/>
        <circle cx="328" cy="170" r="3" fill="#1e1033"/>
      </g>
      <!-- children -->
      <g id="kids">
        <circle cx="60" cy="200" r="14" fill="#f2c9a0"/>
        <rect x="48" y="214" width="24" height="30" rx="6" fill="#ff8c1a"/>
        <circle cx="90" cy="206" r="12" fill="#f2c9a0"/>
        <rect x="80" y="219" width="20" height="26" rx="6" fill="#7bd389"/>
      </g>
      <rect x="0" y="232" width="400" height="28" fill="#0b0617"/>
    </svg>
    <p id="text"></p>
    <button id="next" type="button">Nästa sida</button>
  </div>
  <a class="back" href="index.html">Tillbaka till spelet</a>

  <script>
    const pages = [
      "Två barn går fram mot ett gammalt spökhus när mörkret faller på.",
      "I ett fönster blinkar ett ljus. Något rör sig bakom gardinen!",
      "Ett litet spöke viftar glatt med handen och säger: Kom in och ha roligt!",
      "Barnen tar varandras händer, skrattar och går in i spökhuset för att leta efter godis."
    ];
    let index = 0;
    const text = document.getElementById("text");
    const button = document.getElementById("next");
    const win1 = document.getElementById("win1");
    const ghost = document.getElementById("ghost");

    function showPage() {
      text.textContent = pages[index];
      win1.setAttribute("fill", index === 1 ? "#ff3b3b" : "#ffd166");
      ghost.style.display = index >= 2 ? "inline" : "none";
      button.textContent = index === pages.length - 1 ? "Börja om" : "Nästa sida";
    }

    button.addEventListener("click", () => {
      index = index === pages.length - 1 ? 0 : index + 1;
      showPage();
    });
    showPage();
  </script>
</body>
</html>
