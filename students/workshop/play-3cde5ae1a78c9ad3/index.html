<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stjärnjakten</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-card">
    <div class="stars" aria-hidden="true">✨ 🚀 ⭐</div>
    <h1>Stjärnjakten</h1>
    <p>Tryck på raketen och samla stjärnor!</p>
    <p class="score-board" aria-live="polite">Poäng: <span id="workshop-game-score">0</span></p>
    <button id="workshop-game-click">Click me</button>
    <p id="game-message">Redo, kodare?</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
