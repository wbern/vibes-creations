<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween-rock</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0614; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; cursor: pointer; }
    #hint { position: fixed; left: 0; right: 0; bottom: 1rem; text-align: center;
      color: #fef3c7; font-family: sans-serif; pointer-events: none; }
    #back { position: fixed; top: 0.75rem; left: 0.75rem; color: #fef3c7;
      font-family: sans-serif; }
  </style>
</head>
<body>
  <a id="back" href="index.html">← Tillbaka</a>
  <div id="hint">Klicka för att få mer ljus!</div>
  <script>
    const canvas = document.createElement('canvas');
    canvas.setAttribute('aria-label', 'Halloween-band med pumpa på gitarr, klicka för extra ljus');
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, flash = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawBeams(t) {
      const colors = ['#f97316', '#a855f7', '#22c55e'];
      for (let i = 0; i < 3; i++) {
        const angle = Math.sin(t * 1.2 + i * 2) * 0.6 + (i - 1) * 0.35;
        const x0 = W * (0.2 + i * 0.3), y0 = 0;
        ctx.save();
        ctx.globalAlpha = 0.25 + flash * 0.3;
        ctx.fillStyle = colors[i];
        ctx.beginPath();
        ctx.moveTo(x0 - 4, y0);
        ctx.lineTo(x0 + 4, y0);
        ctx.lineTo(x0 + Math.sin(angle) * H * 1.2 + 120, y0 + H * 0.9);
        ctx.lineTo(x0 + Math.sin(angle) * H * 1.2 - 120, y0 + H * 0.9);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function drawStage() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0b0614');
      g.addColorStop(1, '#3b0764');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#1c1917';
      ctx.fillRect(0, H * 0.8, W, H * 0.2);
    }

    function drawBand(t) {
      const s = Math.min(W, H) * 0.12;
      const cx = W / 2;
      const base = H * 0.8;
      const bob = Math.abs(Math.sin(t * 4)) * s * 0.15 + flash * s * 0.2;

      // Pumpkin head
      const headY = base - s * 2.2 - bob;
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.ellipse(cx, headY, s * 0.9, s * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(cx - 4, headY - s * 0.8 - 10, 8, 12);

      // Glowing eyes and mouth
      ctx.fillStyle = '#fef3c7';
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.5, headY - s * 0.2);
      ctx.lineTo(cx - s * 0.2, headY - s * 0.2);
      ctx.lineTo(cx - s * 0.35, headY - s * 0.5);
      ctx.moveTo(cx + s * 0.5, headY - s * 0.2);
      ctx.lineTo(cx + s * 0.2, headY - s * 0.2);
      ctx.lineTo(cx + s * 0.35, headY - s * 0.5);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.5, headY + s * 0.2);
      ctx.quadraticCurveTo(cx, headY + s * 0.7, cx + s * 0.5, headY + s * 0.2);
      ctx.quadraticCurveTo(cx, headY + s * 0.45, cx - s * 0.5, headY + s * 0.2);
      ctx.fill();

      // Body
      ctx.fillStyle = '#111827';
      ctx.fillRect(cx - s * 0.6, headY + s * 0.8, s * 1.2, s * 1.4);

      // Guitar, strummed in time with the beat
      const strum = Math.sin(t * 8) * 0.15;
      ctx.save();
      ctx.translate(cx + s * 0.2, headY + s * 1.6);
      ctx.rotate(-0.6 + strum);
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.55, s * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7f1d1d';
      ctx.fillRect(-s * 0.1, -s * 1.6, s * 0.2, s * 1.3);
      ctx.restore();
    }

    function draw(t) {
      drawStage();
      drawBeams(t);
      drawBand(t);
      flash = Math.max(0, flash - 0.02);
    }

    function frame(time) {
      draw(time / 1000);
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    canvas.addEventListener('click', () => { flash = 1; });
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
