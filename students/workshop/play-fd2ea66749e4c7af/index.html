<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stjärnklickaren</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-card">
    <div class="stars" aria-hidden="true">✨ 🚀 ⭐</div>
    <h1>Stjärnklickaren</h1>
    <p>Samla så många stjärnpoäng du kan!</p>
    <div class="score-board" aria-live="polite">Poäng: <span id="workshop-game-score">0</span></div>
    <button id="workshop-game-click">Click me</button>
    <p id="cheer" class="cheer">Klicka på knappen för att börja!</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
