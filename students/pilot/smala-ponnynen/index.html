  <style>
    /* Theme tokens — the four presets are papper · skog · hav · neon.
     * The chunky helpers (.card, .btn-chunky, .pill, .wobble, .pop-in)
     * come from the boilerplate Claude uses for every new page. */
    :root {
      --bg: #f4ecd8;
      --ink: #2b2b2b;
      --card: #ffffff;
      --accent: #ff7a5a;
      --accent-2: #58a4ff;
      --radius: 20px;
      --lip: 8px;
    }
    html, body { margin: 0; min-height: 100vh; -webkit-text-size-adjust: 100%; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--accent) 30%, transparent) 0, transparent 40%),
        radial-gradient(circle at 80% 90%, color-mix(in srgb, var(--accent-2) 25%, transparent) 0, transparent 45%);
      display: grid;
      place-items: center;
      padding: 2rem;
      box-sizing: border-box;
      color: var(--ink);
    }
    h1, .h1 { font: 900 2.2rem/1.05 system-ui, sans-serif; letter-spacing: -0.02em; margin: 0 0 .25rem; }
    h2, .h2 { font: 800 1.4rem/1.2 system-ui, sans-serif; margin: 0 0 1rem; }
    .page { max-width: 32rem; margin: 0 auto; width: 100%; }
    .stack { display: flex; flex-direction: column; gap: 1rem; }
    .row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
    .center { text-align: center; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 var(--lip) 0 color-mix(in srgb, var(--c, var(--ink)) 14%, transparent);
    }
    .pill {
      display: inline-block;
      padding: .3rem .7rem;
      background: var(--c, var(--accent-2));
      color: #fff;
      border-radius: 999px;
      font: 700 .85rem/1 system-ui, sans-serif;
    }
    .btn-chunky {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      width: 100%;
      padding: 14px 22px;
      border: 0;
      border-radius: var(--radius);
      font: 800 17px/1.2 system-ui, sans-serif;
      color: #fff;
      background: var(--c, var(--accent));
      box-shadow: 0 var(--lip) 0 color-mix(in srgb, var(--c, var(--accent)) 70%, black);
      cursor: pointer;
      transition: transform 80ms, box-shadow 80ms, filter 120ms;
    }
    .btn-chunky:active { transform: translateY(var(--lip)); box-shadow: 0 0 0 transparent; }
    .btn-chunky.correct { --c: #3f8a4a; }
    .btn-chunky.wrong { --c: #c0392b; }
    .pop { transition: transform 80ms; }
    .pop:active { transform: scale(.96); }
    @keyframes pop-in { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .pop-in { animation: pop-in 240ms cubic-bezier(.5,1.6,.4,1) both; }
    .bg-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .level-btn.selected { outline: 4px solid var(--ink); outline-offset: 2px; }
  </style>
</head>

    // Delar upp alla frågor i tjugo levels med 5 frågor i varje.
    // Level 1 blir de första fem (lättast), level 20 de sista fem (svårast).
    var LEVELS = {};
    var QUESTIONS_PER_LEVEL = 5;
    for (var lvl = 1; lvl <= 20; lvl++) {
      var start = (lvl - 1) * QUESTIONS_PER_LEVEL;
      LEVELS[lvl] = QUESTION_BANK.slice(start, start + QUESTIONS_PER_LEVEL);
    }

    var current = 0;   // vilken fråga vi är på
    var score = 0;     // hur många rätt

    var menuCardEl = document.getElementById("menu-card");
    var levelCardEl = document.getElementById("level-card");
    var levelListEl = document.getElementById("level-list");
    var progressEl = document.getElementById("progress");
    var questionEl = document.getElementById("question");
    var answersEl = document.getElementById("answers");
    var cardEl = document.getElementById("quiz-card");
    var langSelectCardEl = document.getElementById("lang-select-card");
    var langSelectListEl = document.getElementById("lang-select-list");
    var langLevelCardEl = document.getElementById("lang-level-card");
    var langLevelTitleEl = document.getElementById("lang-level-title");
    var langLevelListEl = document.getElementById("lang-level-list");
    var trainCardEl = document.getElementById("train-card");

    // Döljer alla skärmar utom den som skickas in — håller reda på "var i appen"
    // spelaren är just nu, så bara en ruta syns åt gången.
    function showScreen(el) {
      [menuCardEl, levelCardEl, cardEl, langSelectCardEl, langLevelCardEl, trainCardEl].forEach(function (s) {
        s.style.display = (s === el) ? "" : "none";
      });
    }

    // Alla tillbaka-knappar delar samma logik: data-back säger vilken
    // skärm de ska hoppa till.
    var BACK_TARGETS = {
      menu: menuCardEl,
      level: levelCardEl,
      langselect: langSelectCardEl,
      langlevel: langLevelCardEl
    };
    document.querySelectorAll(".back-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        showScreen(BACK_TARGETS[btn.dataset.back]);
      });
    });

    // Räknar ut en färg mellan grönt (lätt) och rött (svårt) för level-knappar.
    // "i" är index (0-baserat), "total" är hur många levels det finns totalt.
    function levelColor(i, total) {
      var t = total > 1 ? i / (total - 1) : 0;
      var from = [0x3f, 0x8a, 0x4a];   // grönt
      var to = [0xc0, 0x39, 0x2b];     // rött
      var mix = from.map(function (c, idx) {
        return Math.round(c + (to[idx] - c) * t);
      });
      return "#" + mix.map(function (c) { return c.toString(16).padStart(2, "0"); }).join("");
    }

    // Startknappar på huvudmenyn.
    document.getElementById("menu-quiz-btn").addEventListener("click", function () {
      showScreen(levelCardEl);
    });
    document.getElementById("menu-train-btn").addEventListener("click", function () {
      showScreen(langSelectCardEl);
    });

    // Bygger de tjugo level-knapparna för quizet.
    var TOTAL_LEVELS = 20;
    for (var lvlNum = 1; lvlNum <= TOTAL_LEVELS; lvlNum++) {
      (function (lvlNum) {
        var btn = document.createElement("button");
        btn.className = "btn-chunky pop level-btn";
        btn.style.setProperty("--c", levelColor(lvlNum - 1, TOTAL_LEVELS));
        btn.textContent = "Level " + lvlNum;
        btn.addEventListener("click", function () {
          QUESTIONS = LEVELS[lvlNum];
          current = 0;
          score = 0;
          showScreen(cardEl);
          showQuestion();
        });
        levelListEl.appendChild(btn);
      })(lvlNum);
    }

    // Ritar upp nuvarande fråga med fyra knappar att klicka på.
    // Ordningen på svaren blandas varje gång, så rätt svar inte alltid
    // ligger först.
    function showQuestion() {
      var item = QUESTIONS[current];
      progressEl.textContent = "Fråga " + (current + 1) + " av " + QUESTIONS.length;
      questionEl.textContent = item.q;
      answersEl.innerHTML = "";

      var options = shuffle(item.answers.map(function (answer, i) {
        return { text: answer, isCorrect: i === item.correct };
      }));

      options.forEach(function (opt) {
        var btn = document.createElement("button");
        btn.className = "btn-chunky pop";
        btn.textContent = opt.text;
        btn.addEventListener("click", function () { pickAnswer(opt.isCorrect, btn); });
        answersEl.appendChild(btn);
      });
    }

    // Kollar om svaret var rätt, färgar knapparna och går vidare.
    function pickAnswer(isCorrect, btn) {
      var allBtns = answersEl.querySelectorAll("button");
      allBtns.forEach(function (b) { b.disabled = true; });

      if (isCorrect) {
        score++;
        btn.classList.add("correct");
      } else {
        btn.classList.add("wrong");
        // Hitta rätt-knappen bland de övriga och markera den grön.
        var correctItem = QUESTIONS[current].answers[QUESTIONS[current].correct];
        allBtns.forEach(function (b) {
          if (b.textContent === correctItem) { b.classList.add("correct"); }
        });
      }

      setTimeout(function () {
        current++;
        if (current < QUESTIONS.length) {
          showQuestion();
        } else {
          showResult();
        }
      }, 900);
    }

    // Visar slutresultatet med en knapp för att välja nivå igen.
    function showResult() {
      cardEl.innerHTML =
        '<h2>Klart! 🎉</h2>' +
        '<p class="pop-in">Du fick <b>' + score + ' av ' + QUESTIONS.length + '</b> rätt.</p>' +
        '<button class="btn-chunky pop" id="restart-btn">Till menyn</button>';
      document.getElementById("restart-btn").addEventListener("click", function () {
        // Bygg tillbaka quiz-kortets innehåll så det är klart nästa gång.
        cardEl.innerHTML =
          '<p id="progress" class="pill">Fråga 1</p>' +
          '<h2 id="question">Laddar fråga...</h2>' +
          '<div class="stack" id="answers"></div>';
        progressEl = document.getElementById("progress");
        questionEl = document.getElementById("question");
        answersEl = document.getElementById("answers");
        showScreen(menuCardEl);
      });
    }

    var WORDS_PER_LANG_LEVEL = 5;
    var currentLangKey = "";
    var trainWords = [];   // orden i den valda leveln
    var trainAll = [];     // alla ord i språket (för att hitta felaktiga alternativ)
    var trainIndex = 0;
    var trainScore = 0;
    var trainStreak = 0;

    var trainQuestionEl = document.getElementById("train-question");
    var trainAnswersEl = document.getElementById("train-answers");
    var trainProgressEl = document.getElementById("train-progress");
    var trainStreakEl = document.getElementById("train-streak");

    // Bygger knapp-rutorna för varje språk att välja bland.
    Object.keys(LANGUAGES).forEach(function (key) {
      var btn = document.createElement("button");
      btn.className = "btn-chunky pop";
      btn.style.setProperty("--c", "#58a4ff");
      btn.textContent = LANGUAGES[key].name;
      btn.addEventListener("click", function () {
        currentLangKey = key;
        showLangLevels(key);
      });
      langSelectListEl.appendChild(btn);
    });

    // Visar level-knappar för det valda språket (5 ord per level).
    function showLangLevels(key) {
      var lang = LANGUAGES[key];
      var numLevels = Math.ceil(lang.words.length / WORDS_PER_LANG_LEVEL);
      langLevelTitleEl.textContent = "Välj level — " + lang.name;
      langLevelListEl.innerHTML = "";
      for (var i = 0; i < numLevels; i++) {
        (function (i) {
          var btn = document.createElement("button");
          btn.className = "btn-chunky pop";
          btn.style.setProperty("--c", levelColor(i, numLevels));
          btn.textContent = "Level " + (i + 1);
          btn.addEventListener("click", function () {
            var start = i * WORDS_PER_LANG_LEVEL;
            trainWords = lang.words.slice(start, start + WORDS_PER_LANG_LEVEL);
            trainAll = lang.words;
            trainIndex = 0;
            trainScore = 0;
            trainStreak = 0;
            showScreen(trainCardEl);
            showTrainQuestion();
          });
          langLevelListEl.appendChild(btn);
        })(i);
      }
      showScreen(langLevelCardEl);
    }

    // Blandar en lista slumpmässigt (Fisher-Yates).
    function shuffle(arr) {
      var copy = arr.slice();
      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
      }
      return copy;
    }

    var hintBtnEl = document.getElementById("hint-btn");
    var hintTextEl = document.getElementById("hint-text");
    var currentTrainItem = null;

    // Visar en flervalsfråga: "Hur säger man X?" med fyra ord-alternativ.
    function showTrainQuestion() {
      var item = trainWords[trainIndex];
      currentTrainItem = item;
      trainProgressEl.textContent = "Ord " + (trainIndex + 1) + " av " + trainWords.length;
      trainStreakEl.textContent = "🔥 " + trainStreak;
      trainQuestionEl.textContent = 'Hur säger man "' + item.sv + '"?';
      hintTextEl.textContent = "";
      hintBtnEl.disabled = false;
      hintBtnEl.style.opacity = "1";

      // Ta tre felaktiga ord från samma språk (inte samma som rätt svar).
      var others = trainAll.filter(function (w) { return w.word !== item.word; });
      var wrongOnes = shuffle(others).slice(0, 3);
      var options = shuffle([item].concat(wrongOnes));

      trainAnswersEl.innerHTML = "";
      options.forEach(function (opt) {
        var btn = document.createElement("button");
        btn.className = "btn-chunky pop";
        btn.textContent = opt.word + "  (" + opt.say + ")";
        btn.dataset.isCorrect = (opt === item) ? "1" : "0";
        btn.addEventListener("click", function () { pickTrainAnswer(opt === item, btn); });
        trainAnswersEl.appendChild(btn);
      });
    }

    // Talking Panda ger en ledtråd: visar uttalet och stryker ett
    // felaktigt alternativ. Fungerar bara en gång per fråga.
    hintBtnEl.addEventListener("click", function () {
      hintBtnEl.disabled = true;
      hintBtnEl.style.opacity = ".5";
      hintTextEl.textContent = '🐼 Det låter ungefär som "' + currentTrainItem.say + '"';

      var wrongBtns = Array.prototype.filter.call(
        trainAnswersEl.querySelectorAll("button"),
        function (b) { return b.dataset.isCorrect === "0" && !b.disabled; }
      );
      if (wrongBtns.length) {
        var toFade = wrongBtns[Math.floor(Math.random() * wrongBtns.length)];
        toFade.disabled = true;
        toFade.style.opacity = ".35";
      }
    });

    // Kollar svaret, färgar knapparna, räknar poäng/streak och går vidare.
    function pickTrainAnswer(isCorrect, btn) {
      var allBtns = trainAnswersEl.querySelectorAll("button");
      allBtns.forEach(function (b) { b.disabled = true; });

      if (isCorrect) {
        trainScore++;
        trainStreak++;
        btn.classList.add("correct");
      } else {
        trainStreak = 0;
        btn.classList.add("wrong");
      }
      trainStreakEl.textContent = "🔥 " + trainStreak;

      setTimeout(function () {
        trainIndex++;
        if (trainIndex < trainWords.length) {
          showTrainQuestion();
        } else {
          showTrainResult();
        }
      }, 900);
    }

    // Visar resultatet för språk-leveln, med knapp tillbaka till level-valet.
    function showTrainResult() {
      trainCardEl.querySelector(".back-btn").style.display = "none";
      hintBtnEl.style.display = "none";
      hintTextEl.textContent = "";
      trainQuestionEl.textContent = "";
      trainAnswersEl.innerHTML =
        '<p class="pop-in">Du fick <b>' + trainScore + ' av ' + trainWords.length + '</b> rätt! 🎉</p>' +
        '<button class="btn-chunky pop" id="train-result-btn" style="--c:#3f8a4a">Tillbaka till levels</button>';
      document.getElementById("train-result-btn").addEventListener("click", function () {
        trainCardEl.querySelector(".back-btn").style.display = "";
        hintBtnEl.style.display = "";
        showLangLevels(currentLangKey);
      });
    }
