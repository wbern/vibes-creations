<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3D-potatis</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a140f; touch-action: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    h1 {
      position: fixed; top: .75rem; left: 50%; transform: translateX(-50%);
      margin: 0; color: #fff; font: 900 1.4rem system-ui, sans-serif;
      letter-spacing: -0.02em; text-shadow: 0 2px 0 rgba(0,0,0,.4);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <h1>🥔 Snurrpotatisen</h1>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a140f);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xfff2e0, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(4, 5, 3);
    scene.add(dir);

    // Bygg potatisformen: börja med en klot-geometri (icosahedron, mjuk),
    // knuffa sedan varje hörn lite slumpmässigt så den blir knölig och
    // avlång istället för perfekt rund — det är det som gör den till potatis.
    const geo = new THREE.IcosahedronGeometry(1.3, 5);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const v = new THREE.Vector3().fromBufferAttribute(pos, i);
      const bump = 0.95 + Math.sin(v.x * 3) * 0.025 + Math.sin(v.y * 4 + v.z * 2) * 0.02 + (Math.random() - 0.5) * 0.015;
      v.multiplyScalar(bump);
      v.x *= 1.35; // sträck ut den lite på längden, som en riktig potatis
      v.y *= 0.9;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();

    const potato = new THREE.Mesh(
      geo,
      new THREE.MeshStandardMaterial({ color: 0xc79a5c, roughness: 0.85, flatShading: false })
    );
    scene.add(potato);

    // Potatisögon: små mörka prickar utspridda på ytan, precis som på
    // en riktig potatis. Vi placerar dem slumpmässigt på klotytan och
    // flyttar dem ut lite från centrum så de sitter ovanpå knölarna.
    const eyeGeo = new THREE.SphereGeometry(0.045, 8, 8);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 1 });
    for (let i = 0; i < 10; i++) {
      const dir3 = new THREE.Vector3(
        Math.random() * 2 - 1,
        Math.random() * 2 - 1,
        Math.random() * 2 - 1
      ).normalize();
      const eye = new THREE.Mesh(eyeGeo, eyeMat);
      eye.position.copy(dir3).multiplyScalar(1.15);
      eye.position.x *= 1.35;
      eye.position.y *= 0.9;
      potato.add(eye);
    }

    // Glad jordgubbe: en röd kotte-liknande kropp, gröna blad ovanpå,
    // och ett ansikte (två ögon + ett leende) gjort av små mörka klot
    // och en böjd linje. Allt sitter i en "pivot"-grupp som vi snurrar
    // för att få jordgubben att flyga i en cirkel runt potatisen.
    const strawberryPivot = new THREE.Group();
    scene.add(strawberryPivot);

    const strawberry = new THREE.Group();
    strawberry.position.set(2.6, 0.6, 0);
    strawberryPivot.add(strawberry);

    const berryBody = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xe8384f, roughness: 0.6 })
    );
    berryBody.scale.set(1, 1.2, 1);
    strawberry.add(berryBody);

    // Små frön runt om på jordgubben
    const seedGeo = new THREE.SphereGeometry(0.03, 6, 6);
    const seedMat = new THREE.MeshStandardMaterial({ color: 0xffe27a });
    for (let i = 0; i < 16; i++) {
      const dir3 = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 1.4 - 0.4, Math.random() * 2 - 1).normalize();
      const seed = new THREE.Mesh(seedGeo, seedMat);
      seed.position.copy(dir3).multiplyScalar(0.42);
      seed.position.y = Math.abs(seed.position.y) - 0.1;
      strawberry.add(seed);
    }

    // Gröna blad ovanpå
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f8a4a, roughness: 0.7 });
    for (let i = 0; i < 5; i++) {
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.32, 4), leafMat);
      const angle = (i / 5) * Math.PI * 2;
      leaf.position.set(Math.cos(angle) * 0.15, 0.55, Math.sin(angle) * 0.15);
      leaf.rotation.x = 0.5;
      leaf.rotation.y = angle;
      strawberry.add(leaf);
    }

    // Glatt ansikte: två ögon och ett leende av små klot i en båge
    const faceMat = new THREE.MeshStandardMaterial({ color: 0x2b1a12 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), faceMat);
    eyeL.position.set(-0.13, 0.15, 0.36);
    strawberry.add(eyeL);
    const eyeR = eyeL.clone();
    eyeR.position.x = 0.13;
    strawberry.add(eyeR);
    for (let i = 0; i < 7; i++) {
      const t = (i / 6 - 0.5) * 0.9;
      const smileDot = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 6), faceMat);
      smileDot.position.set(t * 0.22, -0.05 - Math.cos(t * 1.6) * 0.08, 0.38);
      strawberry.add(smileDot);
    }

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let t = 0;
    renderer.setAnimationLoop(() => {
      t += 0.016;
      potato.rotation.y += 0.006;
      strawberryPivot.rotation.y += 0.012; // flyger runt potatisen
      strawberry.position.y = 0.6 + Math.sin(t * 3) * 0.15; // guppar upp och ner
      strawberry.rotation.z = Math.sin(t * 3) * 0.15;
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
