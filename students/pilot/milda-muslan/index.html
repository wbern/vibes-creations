<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>min sida</title>
  <!-- pilot-william1 -->
  <style>
    /* Theme tokens — the four presets are papper · skog · hav · neon.
     * The chunky helpers (.card, .btn-chunky, .pill, .wobble, .pop-in)
     * come from the boilerplate Claude uses for every new page. */
    :root {
      --bg: #0f0c1a;
      --ink: #f5f5f5;
      --card: #1c1830;
      --accent: #ff3ea5;
      --accent-2: #3ef0ff;
      --radius: 20px;
      --lip: 8px;
    }
    html, body { margin: 0; min-height: 100vh; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--accent) 30%, transparent) 0, transparent 40%),
        radial-gradient(circle at 80% 90%, color-mix(in srgb, var(--accent-2) 25%, transparent) 0, transparent 45%);
      display: grid;
      place-items: center;
      padding: 2rem;
      box-sizing: border-box;
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overflow: hidden;
    }

    /* ── Neonklossen ─────────────────────────────────────────── */
    .page { max-width: 30rem; padding: 1.25rem; box-sizing: border-box; }
    .stack { display: flex; flex-direction: column; gap: .5rem; align-items: center; }
    .center { text-align: center; }
    h1 {
      font: 900 2.2rem/1.05 system-ui, sans-serif;
      margin: 0;
      color: var(--accent-2);
      text-shadow: 0 0 8px var(--accent-2), 0 0 22px var(--accent-2);
    }
    p { opacity: .8; margin: 0 0 1.5rem; }

    /* The scene gives the cube its 3D perspective — like looking
       through a little window into 3D space. */
    .scene {
      width: 180px;
      height: 180px;
      perspective: 700px;
    }

    /* The cube itself is just an empty box: its six children (the
       faces) get pushed out in six directions to form the sides. */
    .cube {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      cursor: pointer;
      animation: spin 6s linear infinite;
    }
    @keyframes spin {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to   { transform: rotateX(360deg) rotateY(360deg); }
    }

    /* When you click: the spin pauses and the cube falls, hits the
       "floor" and bounces a couple of times before settling. The
       wrapper (.scene) stays put — we animate the cube's own
       translateY so the fall happens inside the little 3D window. */
    .cube.dropping {
      animation: drop 900ms cubic-bezier(.3, 0, .7, 1) forwards;
    }
    @keyframes drop {
      0%   { transform: translateY(-10px) rotateX(0) rotateY(0) scale(1); }
      35%  { transform: translateY(140px) rotateX(180deg) rotateY(90deg) scale(1); }
      50%  { transform: translateY(60px) rotateX(220deg) rotateY(140deg) scale(1.08); }
      65%  { transform: translateY(140px) rotateX(280deg) rotateY(190deg) scale(.96); }
      78%  { transform: translateY(100px) rotateX(320deg) rotateY(230deg) scale(1.03); }
      90%  { transform: translateY(140px) rotateX(350deg) rotateY(260deg) scale(1); }
      100% { transform: translateY(0px) rotateX(360deg) rotateY(270deg) scale(1); }
    }
    .cube.flash .face {
      animation: flash 300ms ease-out;
    }
    @keyframes flash {
      0%   { box-shadow: 0 0 40px 12px var(--c), 0 0 70px var(--c), inset 0 0 30px var(--c); }
      100% { box-shadow: 0 0 12px var(--c), 0 0 30px var(--c), inset 0 0 20px var(--c); }
    }

    /* Each face is a glowing neon square. --c picks which theme
       color this particular face glows with. */
    .face {
      position: absolute;
      width: 180px;
      height: 180px;
      background: color-mix(in srgb, var(--c) 18%, transparent);
      border: 3px solid var(--c);
      box-shadow:
        0 0 12px var(--c),
        0 0 30px var(--c),
        inset 0 0 20px var(--c);
    }
    .front  { --c: var(--accent);   transform: translateZ(90px); }
    .back   { --c: var(--accent-2); transform: translateZ(-90px) rotateY(180deg); }
    .right  { --c: var(--accent-2); transform: translateX(90px) rotateY(90deg); }
    .left   { --c: var(--accent);   transform: translateX(-90px) rotateY(-90deg); }
    .top    { --c: var(--accent);   transform: translateY(-90px) rotateX(90deg); }
    .bottom { --c: var(--accent-2); transform: translateY(90px) rotateX(-90deg); }
  </style>
</head>
<body>
  <div class="page stack center">
    <h1>Neonklossen</h1>
    <p>Klicka på klossen!</p>
    <div class="scene" id="scene">
      <div class="cube pop" id="cube">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
      </div>
    </div>
  </div>

  <script>
    // When the cube is clicked: stop the lazy spin, play the drop+bounce,
    // flash the glow extra bright, then go back to spinning like nothing
    // happened.
    var cube = document.getElementById("cube");
    var isDropping = false;
    cube.addEventListener("pointerdown", function () {
      if (isDropping) return;
      isDropping = true;
      cube.style.animation = "none"; // stop the idle spin
      // Force the browser to notice the style was reset before we add
      // the drop class again — otherwise it thinks nothing changed.
      void cube.offsetWidth;
      cube.classList.add("dropping", "flash");

      cube.addEventListener("animationend", function done(e) {
        if (e.animationName !== "drop") return;
        cube.removeEventListener("animationend", done);
        cube.classList.remove("dropping", "flash");
        cube.style.animation = ""; // let the idle spin CSS take back over
        isDropping = false;
      });
    });
  </script>
</body>
</html>
