<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studsboll 3D</title>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; overflow: hidden; overscroll-behavior: none; background: #0f0c1a; }
    body {
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: system-ui, sans-serif;
      color: #f5f5f5;
    }
    #hint {
      position: fixed; top: 1.2rem; left: 50%; transform: translateX(-50%);
      font: 800 1.1rem/1 system-ui, sans-serif; letter-spacing: .02em;
      padding: .6rem 1.1rem; border-radius: 999px;
      background: rgba(255,255,255,.08); backdrop-filter: blur(6px);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hint">Klicka på formen för att hoppa!</div>
  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f0c1a);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 2, 6);
    camera.lookAt(0, 0.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(5, 8, 5);
    scene.add(dir);

    // Vår hoppande figur - en ikosaeder (rundad låg-poly boll) ser rolig och studsig ut
    const shape = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1, 1),
      new THREE.MeshStandardMaterial({ color: 0xff3ea5, flatShading: true })
    );
    shape.position.y = 1;
    scene.add(shape);

    // Mjuk studsig markskugga så hoppet känns förankrat i marken
    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(1, 32),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.01;
    scene.add(shadow);

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // --- Hopplogik ---------------------------------------------------
    // "progress" går från 0 (marken) till 1 (toppen av hoppet) och
    // tillbaka till 0. Vi använder easing-kurvor så hoppet känns
    // snabbt uppåt och lite guppigt när det landar - "polerat" istället
    // för en rak linjär rörelse.
    const JUMP_DURATION = 0.55; // sekunder
    const JUMP_HEIGHT = 1.6;
    let jumpT = null; // null = står stilla, annars 0..1 under hoppet

    function startJump() {
      if (jumpT !== null) return; // redan i luften - vänta tills landning
      jumpT = 0;
    }

    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      shape.rotation.y += 0.006;

      if (jumpT !== null) {
        jumpT += dt / JUMP_DURATION;
        if (jumpT >= 1) {
          jumpT = null;
          shape.position.y = 1;
          shape.scale.set(1, 1, 1);
          shadow.scale.set(1, 1, 1);
        } else {
          // parabel upp och ner (0 -> 1 -> 0), ger höjden
          const arc = Math.sin(jumpT * Math.PI);
          shape.position.y = 1 + arc * JUMP_HEIGHT;
          // squash & stretch: platt när den lämnar/landar marken, sträckt i toppen
          const stretch = 1 + arc * 0.25;
          const squash = 1 - arc * 0.15;
          shape.scale.set(squash, stretch, squash);
          // skuggan krymper när bollen är högt uppe
          const shadowScale = 1 - arc * 0.6;
          shadow.scale.set(shadowScale, shadowScale, shadowScale);
        }
      }

      renderer.render(scene, camera);
    });

    // --- Klick-detektion ---------------------------------------------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    renderer.domElement.addEventListener("pointerdown", (e) => {
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(shape);
      if (hits.length > 0) startJump();
    });
  </script>
</body>
</html>
