<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vaibhav's Block World</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
           -webkit-tap-highlight-color: transparent; touch-action: none; }
    #topLeft {
      position: fixed; top: .6rem; left: .6rem; z-index: 5;
      display: flex; align-items: center; gap: .5rem;
    }
    #menuBtn {
      border: 0; border-radius: 10px; width: 44px; height: 44px;
      font: 900 1.2rem/1 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.5);
      box-shadow: 0 4px 0 rgba(0,0,0,.3); cursor: pointer;
    }
    #menuBtn:active { transform: translateY(4px); box-shadow: none; }
    #info {
      font: 800 .9rem system-ui, sans-serif; color: #fff;
      background: rgba(0,0,0,.35); padding: .4rem .7rem; border-radius: 10px;
    }
    .overlay {
      position: fixed; inset: 0; z-index: 30; display: none;
      background: rgba(0,0,0,.55); align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }
    .overlay .card {
      background: #fff; color: #222; border-radius: 16px; padding: 1.4rem;
      width: min(80vw, 320px); text-align: center;
      font-family: system-ui, sans-serif;
    }
    .overlay .card h2 { margin: 0 0 .8rem; font-size: 1.3rem; }
    .overlay .card button {
      display: block; width: 100%; margin: .5rem 0; padding: .8rem;
      border: 0; border-radius: 10px; font: 800 1rem system-ui, sans-serif;
      color: #fff; cursor: pointer;
    }
    #restartBtn { background: #d64545; box-shadow: 0 4px 0 #8f2c2c; }
    #closeMenuBtn, #closeInvBtn { background: #58a4ff; box-shadow: 0 4px 0 #2f6bb0; }
    #invBtn {
      position: fixed; top: .6rem; left: 4.4rem; z-index: 5;
      border: 0; border-radius: 10px; width: 44px; height: 44px;
      font: 1.3rem/1 system-ui, sans-serif; background: rgba(0,0,0,.5);
      box-shadow: 0 4px 0 rgba(0,0,0,.3); cursor: pointer;
    }
    #invBtn:active { transform: translateY(4px); box-shadow: none; }
    #invList { text-align: left; max-height: 50vh; overflow-y: auto; }
    #invList .inv-row {
      display: flex; align-items: center; gap: .5rem; padding: .3rem 0;
      font: 700 1rem system-ui, sans-serif;
    }
    #invList .inv-swatch { width: 20px; height: 20px; border-radius: 5px; flex: none; }
    #invEmpty { opacity: .6; font-style: italic; }
    #startScreen {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(#87ceeb, #bfe6ff);
      font-family: system-ui, sans-serif; text-align: center; padding: 1rem;
    }
    #startScreen h1 { font-size: clamp(1.8rem, 8vw, 3rem); margin: 0 0 .3rem; color: #2b2b2b; }
    #startScreen p { color: #2b2b2b; margin: 0 0 1.5rem; font-size: 1rem; }
    #playBtn {
      border: 0; border-radius: 16px; padding: 1rem 2.2rem;
      font: 900 1.3rem system-ui, sans-serif; color: #fff; background: #3f8a4a;
      box-shadow: 0 6px 0 #285c30; cursor: pointer;
    }
    #playBtn:active { transform: translateY(6px); box-shadow: none; }
    #startScreen.hidden { display: none; }
    #toolbar {
      position: fixed; left: 0; right: 0; top: 3.2rem; z-index: 5;
      display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap;
      padding: 0 .6rem;
    }
    #actionBar {
      position: fixed; right: 1.2rem; bottom: 9.8rem; z-index: 6;
      display: flex; flex-direction: column; gap: .6rem;
    }
    .swatch {
      width: 48px; height: 48px; border-radius: 12px; border: 3px solid #fff;
      box-shadow: 0 4px 0 rgba(0,0,0,.35);
      cursor: pointer; transition: transform 80ms;
    }
    .swatch.active { border-color: #222; transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
    .swatch:active { transform: translateY(4px); box-shadow: none; }
    #removeBtn {
      min-width: 76px; min-height: 68px; border: 0; border-radius: 14px;
      font: 800 1.9rem/1 system-ui, sans-serif; color: #fff; background: #d64545;
      box-shadow: 0 5px 0 #8f2c2c; cursor: pointer; transition: transform 80ms;
    }
    #removeBtn:active, #buildBtn:active { transform: translateY(5px); box-shadow: none; }
    #buildBtn {
      min-width: 76px; min-height: 68px; border: 0; border-radius: 14px;
      font: 800 1.9rem/1 system-ui, sans-serif; color: #fff; background: #3f8a4a;
      box-shadow: 0 5px 0 #285c30; cursor: pointer; transition: transform 80ms;
    }

    /* Left thumb: joystick to walk. Right side of screen: drag to look. */
    #joyBase {
      position: fixed; left: 1.2rem; bottom: 5.5rem; z-index: 6;
      width: 130px; height: 130px; border-radius: 50%;
      background: rgba(120,120,120,.85); border: 3px solid rgba(255,255,255,.9);
      touch-action: none;
    }
    #joyStick {
      position: absolute; left: 39px; top: 39px; width: 52px; height: 52px;
      border-radius: 50%; background: #fff;
    }
    #jumpBtn {
      position: fixed; right: 1.2rem; bottom: 5.5rem; z-index: 6;
      width: 88px; height: 88px; border-radius: 50%; border: 0;
      font: 900 1.1rem system-ui, sans-serif; color: #fff; background: #3f8a4a;
      box-shadow: 0 5px 0 #285c30;
    }
    #jumpBtn:active { transform: translateY(4px); box-shadow: none; }
    #crosshair {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 10px; height: 10px; z-index: 5; pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: rgba(255,255,255,.9);
    }
    #crosshair::before { left: 4px; top: 0; width: 2px; height: 10px; }
    #crosshair::after { left: 0; top: 4px; width: 10px; height: 2px; }
    #modeBtn { background: #58a4ff; box-shadow: 0 4px 0 #2f6bb0; }
    #healthWrap {
      position: fixed; top: .6rem; right: .6rem; z-index: 5;
      width: 130px; height: 16px; background: rgba(0,0,0,.35); border-radius: 8px; overflow: hidden;
    }
    #healthBar { height: 100%; width: 100%; background: #e94b4b; transition: width 150ms; }
    #clockDisplay {
      position: fixed; top: 3.4rem; right: .6rem; z-index: 5;
      font: 800 .95rem system-ui, sans-serif; color: #fff;
      background: rgba(0,0,0,.35); padding: .3rem .6rem; border-radius: 10px;
    }
    #inventoryBar {
      position: fixed; left: 0; right: 0; top: .6rem; z-index: 5;
      display: flex; justify-content: center; gap: .4rem; flex-wrap: wrap;
      pointer-events: none;
    }
    .inv-pill {
      display: flex; align-items: center; gap: .3rem;
      background: rgba(0,0,0,.4); color: #fff; border-radius: 999px;
      padding: .2rem .55rem; font: 800 .8rem system-ui, sans-serif;
    }
    .inv-swatch { width: 14px; height: 14px; border-radius: 4px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="startScreen">
    <h1>🧱 Vaibhav's Block World</h1>
    <p>Bygg, gräv, jaga djur och utforska byn!</p>
    <button id="playBtn">▶ Spela</button>
  </div>
  <div id="topLeft">
    <button id="menuBtn">☰</button>
    <div id="info">Joystick = walk · drag right side = look · 🧱 place · ⛏️ break</div>
  </div>
  <button id="invBtn" title="Inventory">🎒</button>
  <div id="invOverlay" class="overlay">
    <div class="card">
      <h2>Inventory</h2>
      <div id="invList"></div>
      <button id="closeInvBtn">✖ Stäng</button>
    </div>
  </div>
  <div id="inventoryBar"></div>
  <div id="menuOverlay" class="overlay">
    <div class="card">
      <h2>Meny</h2>
      <button id="modeBtn">⚔️ Survival</button>
      <button id="restartBtn">🔄 Börja om världen</button>
      <button id="closeMenuBtn">✖ Stäng</button>
    </div>
  </div>
  <div id="toolbar"></div>
  <div id="actionBar">
    <button id="buildBtn" title="Place a block">🧱</button>
    <button id="removeBtn" title="Break blocks">⛏️</button>
  </div>
  <div id="joyBase"><div id="joyStick"></div></div>
  <button id="jumpBtn">JUMP</button>
  <div id="crosshair"></div>
  <div id="healthWrap"><div id="healthBar"></div></div>
  <div id="clockDisplay">☀️ 06:00</div>

  <script type="module">
    import * as THREE from "three";

    // The 3D "world" — camera, lights, ground made of cube blocks.
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // sky blue

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(8, 12, 6);
    scene.add(sun);

    // Build a bumpy 20x20 world of grass-on-dirt hills instead of a flat
    // floor — height comes from a simple wavy formula so it looks like
    // rolling terrain without needing a real noise library.
    const SIZE = 1;
    const geo = new THREE.BoxGeometry(SIZE, SIZE, SIZE);
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x5fbf4a });
    const dirtMat = new THREE.MeshStandardMaterial({ color: 0x8a5a34 });
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x777777 });
    const bedrockMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });
    const coalMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
    const ironMat = new THREE.MeshStandardMaterial({ color: 0xd8a878 });
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd23f });
    const diamondMat = new THREE.MeshStandardMaterial({ color: 0x53e0e0 });
    // Deeper stone has a small chance of turning into an ore block instead —
    // coal is common near the top of the stone, diamond only shows up deep.
    function maybeOre(depthFromTop) {
      const roll = Math.random();
      if (depthFromTop > 3 && roll < 0.02) return diamondMat;
      if (depthFromTop > 2 && roll < 0.05) return goldMat;
      if (roll < 0.09) return ironMat;
      if (roll < 0.16) return coalMat;
      return stoneMat;
    }
    const HALF = 20;
    function heightAt(x, z) {
      return Math.max(0, Math.round(
        Math.sin(x * 0.4) * 1.2 + Math.cos(z * 0.35) * 1.2 + Math.sin((x + z) * 0.2)
      ));
    }
    // Dig down through the layers: grass on top, a few dirt layers, then
    // stone, with a solid bedrock floor at the very bottom.
    const DEPTH = 8;
    for (let x = -HALF; x < HALF; x++) {
      for (let z = -HALF; z < HALF; z++) {
        const h = heightAt(x, z);
        for (let y = h - DEPTH; y <= h; y++) {
          const depthFromTop = h - y;
          let mat;
          if (y === h - DEPTH) mat = bedrockMat;
          else if (depthFromTop === 0) mat = grassMat;
          else if (depthFromTop <= 2) mat = dirtMat;
          else mat = maybeOre(depthFromTop);
          const block = new THREE.Mesh(geo, mat);
          block.position.set(x + 0.5, y, z + 0.5);
          scene.add(block);
        }
      }
    }

    // ---- Trees: a trunk of brown blocks with a leafy green top --------
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b });
    const leavesMat = new THREE.MeshStandardMaterial({ color: 0x3f9e4a });
    for (let x = -HALF; x < HALF; x++) {
      for (let z = -HALF; z < HALF; z++) {
        if (Math.random() > 0.03) continue; // trees are rare, ~3% of tiles
        const h = heightAt(x, z);
        const trunkHeight = 2 + Math.floor(Math.random() * 2);
        for (let ty = 1; ty <= trunkHeight; ty++) {
          const trunk = new THREE.Mesh(geo, trunkMat);
          trunk.position.set(x + 0.5, h + ty, z + 0.5);
          scene.add(trunk);
        }
        // A simple 3x3x2 leafy cube cluster sitting on top of the trunk.
        for (let lx = -1; lx <= 1; lx++) {
          for (let lz = -1; lz <= 1; lz++) {
            for (let ly = 0; ly <= 1; ly++) {
              const leaf = new THREE.Mesh(geo, leavesMat);
              leaf.position.set(x + 0.5 + lx, h + trunkHeight + 1 + ly, z + 0.5 + lz);
              scene.add(leaf);
            }
          }
        }
      }
    }

    // ---- A tiny village: a few simple blocky houses clustered together --
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xdcc79a });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0xb0432f });
    function buildHouse(cx, cz, w, d, wallH) {
      const h = heightAt(Math.round(cx), Math.round(cz));
      // Walls: a hollow box made of blocks (skip the inside so it's walkable).
      for (let x = -w; x <= w; x++) {
        for (let z = -d; z <= d; z++) {
          const isEdge = x === -w || x === w || z === -d || z === d;
          if (!isEdge) continue;
          for (let y = 1; y <= wallH; y++) {
            const wall = new THREE.Mesh(geo, wallMat);
            wall.position.set(cx + x, h + y, cz + z);
            scene.add(wall);
          }
        }
      }
      // A simple stepped-pyramid roof on top.
      for (let ring = 0; ring <= Math.min(w, d); ring++) {
        for (let x = -w + ring; x <= w - ring; x++) {
          for (let z = -d + ring; z <= d - ring; z++) {
            if (x !== -w + ring && x !== w - ring && z !== -d + ring && z !== d - ring) continue;
            const roofBlock = new THREE.Mesh(geo, roofMat);
            roofBlock.position.set(cx + x, h + wallH + 1 + ring, cz + z);
            scene.add(roofBlock);
          }
        }
      }
    }
    // Village center is a short walk from spawn so it's easy to find.
    const villageSpots = [
      [7, 6, 2, 2, 3], [11, 7, 2, 3, 3], [8, 11, 3, 2, 4],
      [13, 11, 2, 2, 3], [5, 11, 2, 2, 3],
    ];
    villageSpots.forEach(([cx, cz, w, d, wallH]) => buildHouse(cx, cz, w, d, wallH));

    // Simple dirt paths connecting the houses to each other.
    const pathMat = new THREE.MeshStandardMaterial({ color: 0xc9a876 });
    function layPath(x1, z1, x2, z2) {
      const steps = Math.max(Math.abs(x2 - x1), Math.abs(z2 - z1));
      for (let s = 0; s <= steps; s++) {
        const px = Math.round(x1 + (x2 - x1) * (s / steps));
        const pz = Math.round(z1 + (z2 - z1) * (s / steps));
        const py = heightAt(px, pz);
        const tile = new THREE.Mesh(geo, pathMat);
        tile.position.set(px + 0.5, py, pz + 0.5);
        scene.add(tile);
      }
    }
    for (let i = 1; i < villageSpots.length; i++) {
      layPath(villageSpots[0][0], villageSpots[0][1], villageSpots[i][0], villageSpots[i][1]);
    }

    // ---- Extra detail: flowers on the grass, clouds in the sky --------
    const flowerColors = [0xff5a7a, 0xffe14a, 0xff9f4a, 0xffffff];
    for (let x = -HALF; x < HALF; x++) {
      for (let z = -HALF; z < HALF; z++) {
        if (Math.random() > 0.025) continue; // flowers are sparse
        const h = heightAt(x, z);
        const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
        const flower = new THREE.Mesh(
          new THREE.BoxGeometry(0.18, 0.3, 0.18),
          new THREE.MeshStandardMaterial({ color })
        );
        flower.position.set(x + 0.3 + Math.random() * 0.4, h + 1.15, z + 0.3 + Math.random() * 0.4);
        scene.add(flower);
      }
    }
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, opacity: 0.9, transparent: true });
    for (let i = 0; i < 14; i++) {
      const cloud = new THREE.Group();
      const puffs = 3 + Math.floor(Math.random() * 3);
      for (let p = 0; p < puffs; p++) {
        const puff = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 2), cloudMat);
        puff.position.set(p * 1.6, Math.random() * 0.4, Math.random() * 0.6);
        cloud.add(puff);
      }
      cloud.position.set((Math.random() - 0.5) * HALF * 3, 14 + Math.random() * 6, (Math.random() - 0.5) * HALF * 3);
      scene.add(cloud);
    }

    // ---- First-person walking player -------------------------------
    // The camera itself IS the player's eyes. We track position, a
    // vertical speed (for gravity/jumping), and yaw/pitch look angles.
    const player = {
      x: 0.5, z: 0.5, y: heightAt(0, 0) + 1,
      vy: 0, yaw: 0, pitch: -0.15, onGround: true, jumpsLeft: 2,
    };
    camera.rotation.order = "YXZ";

    // Right half of the screen: drag to look around (classic mobile FPS).
    let lookId = null, lookLastX = 0, lookLastY = 0;
    renderer.domElement.addEventListener("pointerdown", (e) => {
      if (e.clientX < innerWidth / 2) return; // left half is for the joystick area
      lookId = e.pointerId; lookLastX = e.clientX; lookLastY = e.clientY;
    });
    renderer.domElement.addEventListener("pointermove", (e) => {
      if (e.pointerId !== lookId) return;
      player.yaw -= (e.clientX - lookLastX) * 0.009;
      player.pitch -= (e.clientY - lookLastY) * 0.009;
      player.pitch = Math.max(-1.3, Math.min(1.3, player.pitch));
      lookLastX = e.clientX; lookLastY = e.clientY;
    });
    ["pointerup", "pointercancel"].forEach((ev) =>
      renderer.domElement.addEventListener(ev, (e) => { if (e.pointerId === lookId) lookId = null; })
    );

    // Left joystick: drag the stick, its offset becomes a walk direction.
    let joyId = null, joyVec = { x: 0, y: 0 };
    const joyBase = document.getElementById("joyBase");
    const joyStick = document.getElementById("joyStick");
    joyBase.addEventListener("pointerdown", (e) => { joyId = e.pointerId; });
    addEventListener("pointermove", (e) => {
      if (e.pointerId !== joyId) return;
      const r = joyBase.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let dx = e.clientX - cx, dy = e.clientY - cy;
      const max = 44, len = Math.hypot(dx, dy);
      if (len > max) { dx = dx / len * max; dy = dy / len * max; }
      joyStick.style.left = 39 + dx + "px";
      joyStick.style.top = 39 + dy + "px";
      joyVec.x = dx / max; joyVec.y = dy / max;
    });
    ["pointerup", "pointercancel"].forEach((ev) =>
      addEventListener(ev, (e) => {
        if (e.pointerId !== joyId) return;
        joyId = null; joyVec.x = 0; joyVec.y = 0;
        joyStick.style.left = "39px"; joyStick.style.top = "39px";
      })
    );

    // Keyboard fallback (WASD / arrows) for anyone on a real keyboard.
    const keys = {};
    addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
    addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

    let wantsJump = false, jumpHeld = false;
    document.getElementById("jumpBtn").addEventListener("pointerdown", () => { wantsJump = true; jumpHeld = true; });
    document.getElementById("jumpBtn").addEventListener("pointerup", () => { jumpHeld = false; });
    document.getElementById("jumpBtn").addEventListener("pointercancel", () => { jumpHeld = false; });
    addEventListener("keydown", (e) => { if (e.key === " ") { wantsJump = true; jumpHeld = true; } });
    addEventListener("keyup", (e) => { if (e.key === " ") jumpHeld = false; });

    // ---- Creative / Survival mode -----------------------------------
    // Creative: no gravity, hold JUMP to fly up, let go to sink down slowly.
    // Survival: normal gravity + a health bar that drops on hard falls.
    let creative = false;
    let health = 100;
    const modeBtn = document.getElementById("modeBtn");
    const healthWrap = document.getElementById("healthWrap");
    modeBtn.addEventListener("pointerup", () => {
      creative = !creative;
      modeBtn.textContent = creative ? "🎨 Creative" : "⚔️ Survival";
      healthWrap.style.display = creative ? "none" : "block";
      player.vy = 0;
    });

    // All placeable blocks live in this array so the raycaster can hit them.
    const blocks = [];
    scene.children.forEach((c) => { if (c.isMesh) blocks.push(c); });

    // Every collectible material is named here once — this map is used both
    // to label inventory pills AND to look up which material to build with.
    const meatMat = new THREE.MeshStandardMaterial({ color: 0xd9635e });
    const furMat = new THREE.MeshStandardMaterial({ color: 0xcabba0 });
    const namedMats = {
      Grass: grassMat, Dirt: dirtMat, Stone: stoneMat,
      Coal: coalMat, Iron: ironMat, Gold: goldMat, Diamond: diamondMat,
      Wood: trunkMat, Leaves: leavesMat, Meat: meatMat, Fur: furMat,
    };
    const oreNames = new Map(Object.entries(namedMats).map(([name, mat]) => [mat, name]));
    let currentName = null; // nothing selected until you've mined something
    const inventory = {};
    const inventoryBar = document.getElementById("inventoryBar");
    function addToInventory(mat, count = 1) {
      const name = oreNames.get(mat);
      if (!name) return; // bedrock and other non-collectible blocks
      inventory[name] = (inventory[name] || 0) + count;
      renderInventory();
    }
    function renderInventory() {
      inventoryBar.innerHTML = "";
      Object.entries(inventory).forEach(([name, count]) => {
        const pill = document.createElement("div");
        pill.className = "inv-pill";
        const sw = document.createElement("div");
        sw.className = "inv-swatch";
        sw.style.background = "#" + namedMats[name].color.getHexString();
        pill.appendChild(sw);
        pill.appendChild(document.createTextNode(name + " x" + count));
        inventoryBar.appendChild(pill);
      });
      renderHotbar();
    }

    // The hotbar starts empty — a slot only appears once you've mined at
    // least one of that material. Tap a slot to pick what you build with.
    const toolbar = document.getElementById("toolbar");
    function renderHotbar() {
      toolbar.innerHTML = "";
      Object.entries(inventory).filter(([, count]) => count > 0).forEach(([name, count]) => {
        const slot = document.createElement("div");
        slot.className = "swatch" + (name === currentName ? " active" : "");
        slot.style.background = "#" + namedMats[name].color.getHexString();
        slot.title = name + " x" + count;
        slot.addEventListener("pointerup", () => { currentName = name; renderHotbar(); });
        toolbar.appendChild(slot);
      });
    }

    // Build/break: raycast straight out from the crosshair (screen center)
    // along the camera's look direction, and add/remove a block there.
    const raycaster = new THREE.Raycaster();
    const center = new THREE.Vector2(0, 0);
    function buildAtCrosshair() {
      // In Survival you can only build with blocks you've actually mined.
      if (!creative && (!inventory[currentName] || inventory[currentName] <= 0)) return;
      raycaster.setFromCamera(center, camera);
      const hits = raycaster.intersectObjects(blocks);
      if (!hits.length) return;
      const hit = hits[0];
      const newBlock = new THREE.Mesh(geo, namedMats[currentName]);
      newBlock.position.copy(hit.object.position).add(hit.face.normal);
      scene.add(newBlock);
      blocks.push(newBlock);
      if (!creative) {
        inventory[currentName] -= 1;
        if (inventory[currentName] <= 0) currentName = null;
        renderInventory();
      }
    }
    function breakAtCrosshair() {
      raycaster.setFromCamera(center, camera);

      // Attack first: if the crosshair is on an animal, that takes priority
      // over breaking terrain.
      const animalHits = raycaster.intersectObjects(animals.map((a) => a.mesh), true);
      if (animalHits.length) {
        const hitMesh = animalHits[0].object;
        const idx = animals.findIndex((a) => a.mesh === hitMesh || a.mesh.getObjectById(hitMesh.id));
        if (idx !== -1) {
          const a = animals[idx];
          a.hp -= 1;
          if (a.hp <= 0) {
            scene.remove(a.mesh);
            animals.splice(idx, 1);
            addToInventory(meatMat, 1 + Math.floor(Math.random() * 2));
            if (Math.random() < 0.4) addToInventory(furMat, 1);
          }
          return;
        }
      }

      const hits = raycaster.intersectObjects(blocks);
      if (!hits.length || blocks.length <= 1) return;
      addToInventory(hits[0].object.material);
      scene.remove(hits[0].object);
      blocks.splice(blocks.indexOf(hits[0].object), 1);
    }
    document.getElementById("removeBtn").addEventListener("pointerdown", breakAtCrosshair);
    document.getElementById("buildBtn").addEventListener("pointerdown", buildAtCrosshair);

    // ---- Menu: pause-style overlay with a restart option --------------
    const menuOverlay = document.getElementById("menuOverlay");
    document.getElementById("menuBtn").addEventListener("pointerup", () => menuOverlay.classList.add("open"));
    document.getElementById("closeMenuBtn").addEventListener("pointerup", () => menuOverlay.classList.remove("open"));
    document.getElementById("restartBtn").addEventListener("pointerup", () => location.reload());

    // ---- Inventory panel: a bigger list of everything you're carrying --
    const invOverlay = document.getElementById("invOverlay");
    const invList = document.getElementById("invList");
    document.getElementById("invBtn").addEventListener("pointerup", () => {
      invList.innerHTML = "";
      const entries = Object.entries(inventory).filter(([, c]) => c > 0);
      if (!entries.length) {
        invList.innerHTML = '<div id="invEmpty">Tomt — gå ut och bryt block!</div>';
      } else {
        entries.forEach(([name, count]) => {
          const row = document.createElement("div");
          row.className = "inv-row";
          const sw = document.createElement("div");
          sw.className = "inv-swatch";
          sw.style.background = "#" + namedMats[name].color.getHexString();
          row.appendChild(sw);
          row.appendChild(document.createTextNode(name + " x" + count));
          invList.appendChild(row);
        });
      }
      invOverlay.classList.add("open");
    });
    document.getElementById("closeInvBtn").addEventListener("pointerup", () => invOverlay.classList.remove("open"));

    document.getElementById("playBtn").addEventListener("pointerup", () => {
      document.getElementById("startScreen").classList.add("hidden");
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---- Simple blocky animals that wander the hills on their own ----
    function makeAnimal(bodyColor, spotColor) {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor });
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.5), bodyMat);
      body.position.y = 0.5;
      group.add(body);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), bodyMat);
      head.position.set(0.55, 0.55, 0);
      group.add(head);
      if (spotColor) {
        const spot = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.52), new THREE.MeshStandardMaterial({ color: spotColor }));
        spot.position.set(-0.1, 0.55, 0);
        group.add(spot);
      }
      const legMat = bodyMat;
      [[-0.3, -0.2], [-0.3, 0.2], [0.3, -0.2], [0.3, 0.2]].forEach(([lx, lz]) => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.4, 0.15), legMat);
        leg.position.set(lx, 0.2, lz);
        group.add(leg);
      });
      return group;
    }

    // ---- Villagers: simple blocky people who wander near their houses --
    function makeVillager(robeColor) {
      const group = new THREE.Group();
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xe8b892 });
      const robeMat = new THREE.MeshStandardMaterial({ color: robeColor });
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), skinMat);
      head.position.y = 1.55;
      group.add(head);
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 0.25), robeMat);
      body.position.y = 1.05;
      group.add(body);
      [[-0.28, 1.05], [0.28, 1.05]].forEach(([ax]) => {
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), robeMat);
        arm.position.set(ax, 1.05, 0);
        group.add(arm);
      });
      [[-0.12], [0.12]].forEach(([lx]) => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.15), skinMat);
        leg.position.set(lx, 0.35, 0);
        group.add(leg);
      });
      return group;
    }
    const villagerColors = [0x5566cc, 0x66aa55, 0xaa5566, 0xccaa44];
    const villagers = [];
    const VILLAGE_CENTER = { x: 9, z: 9 };
    for (let i = 0; i < 4; i++) {
      const mesh = makeVillager(villagerColors[i % villagerColors.length]);
      const vx = VILLAGE_CENTER.x + (Math.random() - 0.5) * 6;
      const vz = VILLAGE_CENTER.z + (Math.random() - 0.5) * 6;
      mesh.position.set(vx, heightAt(Math.floor(vx), Math.floor(vz)) + 1, vz);
      scene.add(mesh);
      villagers.push({
        mesh, homeX: vx, homeZ: vz, dir: Math.random() * Math.PI * 2,
        timer: Math.random() * 2, speed: 0.3 + Math.random() * 0.3, paused: false,
      });
    }
    function updateVillagers(dt) {
      villagers.forEach((v) => {
        v.timer -= dt;
        if (v.timer <= 0) {
          v.paused = Math.random() < 0.35;
          v.dir += (Math.random() - 0.5) * Math.PI * 1.4;
          v.timer = 1 + Math.random() * 3;
        }
        if (!v.paused) {
          // Stay close to home — a gentle pull back if they wander too far.
          const dx = v.mesh.position.x - v.homeX, dz = v.mesh.position.z - v.homeZ;
          if (Math.hypot(dx, dz) > 4) v.dir = Math.atan2(-dx, -dz);
          v.mesh.position.x += Math.sin(v.dir) * v.speed * dt;
          v.mesh.position.z += Math.cos(v.dir) * v.speed * dt;
          v.mesh.rotation.y = v.dir;
        }
        const gy = heightAt(Math.floor(v.mesh.position.x), Math.floor(v.mesh.position.z)) + 1;
        v.mesh.position.y = gy;
      });
    }

    const animals = [];
    const ANIMAL_KINDS = [
      { body: 0xf2b3c9, spot: null },     // pig
      { body: 0xffffff, spot: 0x2b2b2b }, // cow
      { body: 0x8a8a8a, spot: null },     // sheep-ish gray
    ];
    for (let i = 0; i < 8; i++) {
      const kind = ANIMAL_KINDS[i % ANIMAL_KINDS.length];
      const mesh = makeAnimal(kind.body, kind.spot);
      const ax = (Math.random() - 0.5) * HALF * 1.6;
      const az = (Math.random() - 0.5) * HALF * 1.6;
      mesh.position.set(ax, heightAt(Math.floor(ax), Math.floor(az)) + 1, az);
      scene.add(mesh);
      animals.push({
        mesh, dir: Math.random() * Math.PI * 2, timer: Math.random() * 2,
        speed: 0.35 + Math.random() * 0.7, paused: false, hp: 3,
      });
    }
    function updateAnimals(dt) {
      animals.forEach((a) => {
        a.timer -= dt;
        if (a.timer <= 0) {
          // Sometimes just stop and stand still for a bit, sometimes turn
          // by a random (not full-circle) amount so the path looks natural.
          a.paused = Math.random() < 0.25;
          a.dir += (Math.random() - 0.5) * Math.PI * 1.6;
          a.speed = 0.35 + Math.random() * 0.9;
          a.timer = 0.6 + Math.random() * 2.5;
        }
        if (!a.paused) {
          a.mesh.position.x += Math.sin(a.dir) * a.speed * dt;
          a.mesh.position.z += Math.cos(a.dir) * a.speed * dt;
          a.mesh.rotation.y = a.dir;
        }
        const gy = heightAt(Math.floor(a.mesh.position.x), Math.floor(a.mesh.position.z)) + 1;
        a.mesh.position.y = gy;
      });
    }

    // ---- Main loop: move the player, apply gravity, draw the frame ----
    const clock = new THREE.Clock();

    // ---- Day/night cycle: one full day takes 3 real minutes -----------
    const DAY_LENGTH = 180;
    let gameTime = 0.25; // start mid-morning
    const skyDay = new THREE.Color(0x87ceeb);
    const skyNight = new THREE.Color(0x0a1030);
    const clockEl = document.getElementById("clockDisplay");
    function updateDayNight(dt) {
      gameTime = (gameTime + dt / DAY_LENGTH) % 1;
      const angle = gameTime * Math.PI * 2;
      // Sun swings across the sky; brightness follows how high it is.
      sun.position.set(Math.cos(angle) * 20, Math.sin(angle) * 20, 8);
      const daylight = Math.max(0, Math.sin(angle));
      sun.intensity = 0.15 + daylight * 0.9;
      ambient.intensity = 0.2 + daylight * 0.55;
      scene.background = skyNight.clone().lerp(skyDay, daylight);

      const totalMinutes = Math.floor(gameTime * 24 * 60);
      const hh = String(Math.floor(totalMinutes / 60)).padStart(2, "0");
      const mm = String(totalMinutes % 60).padStart(2, "0");
      const icon = daylight > 0.05 ? "☀️" : "🌙";
      clockEl.textContent = `${icon} ${hh}:${mm}`;
    }
    const WALK_SPEED = 4, GRAVITY = 14, JUMP_SPEED = 6, EYE_HEIGHT = 1.6;
    function groundSurfaceY(px, pz) { return heightAt(Math.floor(px), Math.floor(pz)) + 1; }

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);

      // Combine joystick + keyboard into one movement vector (forward/strafe).
      let fwd = -joyVec.y, strafe = joyVec.x;
      if (keys["w"] || keys["arrowup"]) fwd = 1;
      if (keys["s"] || keys["arrowdown"]) fwd = -1;
      if (keys["a"] || keys["arrowleft"]) strafe = -1;
      if (keys["d"] || keys["arrowright"]) strafe = 1;

      const sinY = Math.sin(player.yaw), cosY = Math.cos(player.yaw);
      player.x += (-fwd * sinY + strafe * cosY) * WALK_SPEED * dt;
      player.z += (-fwd * cosY - strafe * sinY) * WALK_SPEED * dt;

      // Gravity + jumping, with simple "stand on top of the terrain" collision.
      const ground = groundSurfaceY(player.x, player.z) + EYE_HEIGHT;
      if (creative) {
        // Flying: hold jump to rise, otherwise sink gently. No fall damage.
        player.y += (jumpHeld ? 5 : -1.5) * dt;
        if (player.y < ground) player.y = ground;
        wantsJump = false;
      } else {
        if (wantsJump && player.jumpsLeft > 0) {
          player.vy = JUMP_SPEED;
          player.jumpsLeft -= 1;
          player.onGround = false;
        }
        wantsJump = false;
        const fallSpeedBefore = player.vy;
        player.vy -= GRAVITY * dt;
        player.y += player.vy * dt;
        if (player.y <= ground) {
          // Hitting the ground fast hurts — small hops are free.
          if (fallSpeedBefore < -9) {
            health = Math.max(0, health - Math.round((-fallSpeedBefore - 9) * 8));
            document.getElementById("healthBar").style.width = health + "%";
            if (health <= 0) {
              health = 100;
              document.getElementById("healthBar").style.width = "100%";
              player.x = 0.5; player.z = 0.5;
            }
          }
          player.y = ground; player.vy = 0; player.onGround = true; player.jumpsLeft = 2;
        }
      }

      camera.position.set(player.x, player.y, player.z);
      camera.rotation.set(player.pitch, player.yaw, 0);

      updateAnimals(dt);
      updateVillagers(dt);
      updateDayNight(dt);

      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
