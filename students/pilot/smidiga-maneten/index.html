<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini Golf 3D</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a3a1a;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; touch-action: none; }
    #ui {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center;
      padding: 12px; gap: 8px; pointer-events: none;
    }
    #clubs { display: flex; gap: 8px; pointer-events: all; }
    .club-btn {
      padding: 8px 14px; border: 2px solid rgba(255,255,255,.4);
      background: rgba(0,0,0,.45); color: #fff;
      border-radius: 10px; font: 600 13px system-ui;
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    .club-btn.active { background: rgba(255,220,0,.7); color: #222; border-color: #ffd700; }
    #power-bar-wrap {
      width: 80%; max-width: 300px; height: 18px;
      background: rgba(0,0,0,.5); border-radius: 9px; overflow: hidden;
    }
    #power-bar { height: 100%; width: 0%; background: #ff4; border-radius: 9px; transition: width .05s; }
    #aim-hint { color: #fff; font: 600 14px system-ui; text-shadow: 0 1px 3px #000; opacity: .9; }
    #msg {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: #fff; font: 700 2rem system-ui; text-shadow: 0 2px 8px #000;
      display: none; text-align: center; pointer-events: all;
    }
    #next-btn {
      display: none; margin-top: 1rem;
      padding: 14px 32px; background: #2a8; color: #fff;
      border: 0; border-radius: 14px; font: 700 1.1rem system-ui; cursor: pointer;
      pointer-events: all; touch-action: manipulation;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="ui">
  <div id="clubs">
    <button class="club-btn active" data-club="putter" data-speed="0.22">🏌️ Putter</button>
    <button class="club-btn" data-club="iron" data-speed="0.48">🥈 Järn</button>
    <button class="club-btn" data-club="driver" data-speed="0.80">🚀 Driver</button>
  </div>
  <div id="power-bar-wrap"><div id="power-bar"></div></div>
  <div id="aim-hint">Dra för att sikta • Håll för att ladda slag</div>
</div>
<div id="msg">⛳ Hole in one!<br><button id="next-btn" onclick="nextHole()">Nästa hål ➜</button></div>

<script type="module">
import * as THREE from "three";

// ── Scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 80);

const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ── Lights ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 20, 10);
sun.castShadow = true;
scene.add(sun);

// ── Ball ─────────────────────────────────────────────────────────────────────
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xffffff })
);
ball.castShadow = true;
scene.add(ball);

// ── Aim arrow ─────────────────────────────────────────────────────────────────
const arrowMat = new THREE.MeshBasicMaterial({ color: 0xffee00 });
const arrow = new THREE.Group();
const aBody = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.2, 8), arrowMat);
const aHead = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.3, 8), arrowMat);
aBody.position.y = -0.6; aHead.position.y = -1.35;
arrow.add(aBody); arrow.add(aHead);
scene.add(arrow);

// ── Holes config ─────────────────────────────────────────────────────────────
const holes = [
  { w: 8,  d: 22, cx: 0,  cz: -9,  hx: 0,  hz: -18, bx: 0, bz: 0 },
  { w: 6,  d: 26, cx: 2,  cz: -11, hx: 4,  hz: -22, bx: 0, bz: 0 },
  { w: 10, d: 30, cx: 0,  cz: -13, hx: -3, hz: -26, bx: 0, bz: 0 },
];

let holeIdx = 0, aimAngle = 0, strokes = 0;
const ballPos = new THREE.Vector3();
const ballVel = new THREE.Vector3();
let ballMoving = false;

// UI refs (must be declared before loadHole is called)
const powerBar = document.getElementById("power-bar");
const hint = document.getElementById("aim-hint");

// ── Course builder ────────────────────────────────────────────────────────────
function buildHole(h) {
  scene.children.filter(o => o.userData.course).forEach(o => scene.remove(o));
  const tag = o => { o.userData.course = true; return o; };

  // rough
  const rough = new THREE.Mesh(
    new THREE.PlaneGeometry(h.w + 10, h.d + 10),
    new THREE.MeshLambertMaterial({ color: 0x2a6a2a })
  );
  rough.rotation.x = -Math.PI / 2;
  rough.position.set(h.cx, -0.01, h.cz);
  scene.add(tag(rough));

  // green
  const green = new THREE.Mesh(
    new THREE.PlaneGeometry(h.w, h.d),
    new THREE.MeshLambertMaterial({ color: 0x3cb846 })
  );
  green.rotation.x = -Math.PI / 2;
  green.position.set(h.cx, 0, h.cz);
  green.receiveShadow = true;
  scene.add(tag(green));

  // hole
  const holeMesh = new THREE.Mesh(
    new THREE.CircleGeometry(0.3, 24),
    new THREE.MeshBasicMaterial({ color: 0x111111 })
  );
  holeMesh.rotation.x = -Math.PI / 2;
  holeMesh.position.set(h.hx, 0.02, h.hz);
  scene.add(tag(holeMesh));

  // flag pole
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.04, 2.5, 8),
    new THREE.MeshLambertMaterial({ color: 0xdddddd })
  );
  pole.position.set(h.hx, 1.25, h.hz);
  scene.add(tag(pole));

  // flag
  const flag = new THREE.Mesh(
    new THREE.PlaneGeometry(0.7, 0.45),
    new THREE.MeshLambertMaterial({ color: 0xff2222, side: THREE.DoubleSide })
  );
  flag.position.set(h.hx + 0.36, 2.3, h.hz);
  scene.add(tag(flag));
}

function loadHole() {
  const h = holes[holeIdx];
  buildHole(h);
  ballPos.set(h.bx, 0.18, h.bz);
  ball.position.copy(ballPos);
  ballVel.set(0, 0, 0);
  ballMoving = false; strokes = 0; aimAngle = 0;
  updateCamera(); updateArrow();
  hint.textContent = `Hål ${holeIdx + 1} — dra för att sikta, håll för att slå`;
}

window.nextHole = () => {
  holeIdx = (holeIdx + 1) % holes.length;
  loadHole();
  document.getElementById("msg").style.display = "none";
  document.getElementById("next-btn").style.display = "none";
};

loadHole();

// ── Camera & arrow update ─────────────────────────────────────────────────────
function updateCamera() {
  cam.position.set(
    ballPos.x + Math.sin(aimAngle) * 4,
    ballPos.y + 2.5,
    ballPos.z + Math.cos(aimAngle) * 4
  );
  cam.lookAt(ballPos.x, ballPos.y + 0.3, ballPos.z);
}

function updateArrow() {
  arrow.position.set(ballPos.x, 0.06, ballPos.z);
  arrow.rotation.set(Math.PI / 2, 0, -aimAngle);
}

// ── Touch input ───────────────────────────────────────────────────────────────
// ── Club selection ────────────────────────────────────────────────────────────
let clubSpeed = 0.22;
document.querySelectorAll(".club-btn").forEach(btn => {
  btn.addEventListener("pointerdown", e => {
    e.stopPropagation();
    document.querySelectorAll(".club-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    clubSpeed = parseFloat(btn.dataset.speed);
  }, { passive: true });
});

let touchStartX = null, power = 0, charging = false, holdTimer = null;

renderer.domElement.addEventListener("pointerdown", e => {
  touchStartX = e.clientX;
  if (!ballMoving) {
    charging = true; power = 0;
    holdTimer = setInterval(() => {
      power = Math.min(1, power + 0.028);
      powerBar.style.width = (power * 100) + "%";
      powerBar.style.background = power > 0.7 ? "#f44" : power > 0.4 ? "#fa0" : "#ff4";
    }, 50);
  }
}, { passive: true });

renderer.domElement.addEventListener("pointermove", e => {
  if (touchStartX !== null && !ballMoving) {
    aimAngle -= (e.clientX - touchStartX) * 0.006;
    touchStartX = e.clientX;
    updateCamera(); updateArrow();
  }
}, { passive: true });

renderer.domElement.addEventListener("pointerup", () => {
  clearInterval(holdTimer);
  if (charging && !ballMoving && power > 0.03) shoot();
  charging = false; power = 0;
  powerBar.style.width = "0%";
  touchStartX = null;
}, { passive: true });

function shoot() {
  const speed = power * clubSpeed;
  // loft: driver lyfter mest, putter nästan inget
  const loftMap = { 0.22: 0.04, 0.48: 0.12, 0.80: 0.22 };
  const loft = (loftMap[clubSpeed] ?? 0.1) * power;
  ballVel.set(-Math.sin(aimAngle) * speed, loft, -Math.cos(aimAngle) * speed);
  ballMoving = true; strokes++;
  hint.textContent = `Slag: ${strokes}`;
}

// ── Game loop ─────────────────────────────────────────────────────────────────
renderer.setAnimationLoop(() => {
  if (ballMoving) {
    ballVel.multiplyScalar(0.962); // friktion
    ballVel.y -= 0.008;            // gravitation
    ballPos.addScaledVector(ballVel, 1);
    // studsa mot marken
    if (ballPos.y < 0.18) {
      ballPos.y = 0.18;
      ballVel.y = -ballVel.y * 0.35; // lite studs vid landning
      if (Math.abs(ballVel.y) < 0.005) ballVel.y = 0;
    }

    const h = holes[holeIdx];

    // ── Boundary bounce — keep ball on the green ──────────────────────────
    const minX = h.cx - h.w / 2 + 0.2;
    const maxX = h.cx + h.w / 2 - 0.2;
    const minZ = h.cz - h.d / 2 + 0.2;
    const maxZ = h.cz + h.d / 2 - 0.2;
    if (ballPos.x < minX) { ballPos.x = minX; ballVel.x = Math.abs(ballVel.x) * 0.6; }
    if (ballPos.x > maxX) { ballPos.x = maxX; ballVel.x = -Math.abs(ballVel.x) * 0.6; }
    if (ballPos.z < minZ) { ballPos.z = minZ; ballVel.z = Math.abs(ballVel.z) * 0.6; }
    if (ballPos.z > maxZ) { ballPos.z = maxZ; ballVel.z = -Math.abs(ballVel.z) * 0.6; }

    ball.position.copy(ballPos);
    updateCamera(); updateArrow();

    // ── Hole detection (bara när bollen är nere på marken) ────────────────
    const dx = ballPos.x - h.hx;
    const dz = ballPos.z - h.hz;
    if (Math.sqrt(dx * dx + dz * dz) < 0.45 && ballPos.y <= 0.2) {
      ballMoving = false;
      ballVel.set(0, 0, 0);
      const msgEl = document.getElementById("msg");
      msgEl.innerHTML = (strokes === 1 ? "⛳ Hole in one!" : `🏌️ ${strokes} slag!`) +
        "<br><button onclick='nextHole()' style='margin-top:1rem;padding:14px 32px;background:#2a8;color:#fff;border:0;border-radius:14px;font:700 1.1rem system-ui;cursor:pointer;touch-action:manipulation'>Nästa hål ➜</button>";
      msgEl.style.display = "block";
      return;
    }

    // ── Stop when nearly still ────────────────────────────────────────────
    if (ballVel.length() < 0.002) {
      ballMoving = false;
      hint.textContent = `Slag: ${strokes} — sikta och håll för nästa slag`;
    }
  }
  renderer.render(scene, cam);
});

addEventListener("resize", () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
