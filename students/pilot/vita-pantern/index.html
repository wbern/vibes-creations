<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Racing</title>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; overscroll-behavior: none; }
    body {
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: system-ui, sans-serif;
      background: #0f2a3a; color: #fff;
      display: flex; flex-direction: column; align-items: center;
      padding: 1rem; box-sizing: border-box;
    }
    h1 { font: 900 1.8rem/1 system-ui, sans-serif; margin: .25rem 0; }
    #score { font: 800 1.2rem/1 system-ui, sans-serif; margin-bottom: .5rem; }
    canvas { background: #444; border-radius: 12px; touch-action: none; max-width: 100%; }
  </style>
</head>
<body>
  <h1>Racing</h1>
  <p id="score">Poäng: 0</p>
  <canvas id="game" width="360" height="600"></canvas>
  <div style="display:flex; gap:1rem; margin-top:.75rem;">
    <button class="btn-chunky pop" id="left" style="--c:#58a4ff; min-width:80px;">⬅️</button>
    <button class="btn-chunky pop" id="right" style="--c:#58a4ff; min-width:80px;">➡️</button>
    <button class="btn-chunky pop" id="reset" style="--c:#ffd166; display:none;">Börja om</button>
  </div>

  <style>
    .btn-chunky {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 56px; padding: 14px 22px; border: 0; border-radius: 16px;
      font: 800 18px/1 system-ui, sans-serif; color: #fff; letter-spacing: .5px;
      background: var(--c, #ff7a5a);
      box-shadow: 0 6px 0 color-mix(in srgb, var(--c, #ff7a5a) 70%, black);
      cursor: pointer; transition: transform 80ms, box-shadow 80ms;
    }
    .btn-chunky:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }
  </style>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const ROAD_LEFT = 40, ROAD_RIGHT = W - 40;

    // Spelarens bil
    const car = { w: 40, h: 64, x: W / 2 - 20, y: H - 100, speed: 6 };

    let keys = {}; // vilka tangenter som hålls nere
    let score = 0;
    let over = false;
    const scoreEl = document.getElementById("score");

    // Mötande bilar (hinder) som kommer uppifrån
    let obstacles = [];
    let spawnTimer = 0;
    let fallSpeed = 4;

    function spawnObstacle() {
      const w = 40, h = 64;
      const laneX = ROAD_LEFT + Math.random() * (ROAD_RIGHT - ROAD_LEFT - w);
      obstacles.push({ x: laneX, y: -h, w, h });
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // Rita bilen som en enkel form
    function drawCar(x, y, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, car.w, car.h, 8);
      ctx.fill();
      // fönster
      ctx.fillStyle = "#dff";
      ctx.fillRect(x + 8, y + 10, car.w - 16, 16);
    }

    function drawRoad() {
      ctx.fillStyle = "#333";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "#fff";
      ctx.setLineDash([20, 20]);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function loop() {
      if (over) return;
      drawRoad();

      // styr bilen med tangenter
      if (keys.left) car.x -= car.speed;
      if (keys.right) car.x += car.speed;
      car.x = Math.max(ROAD_LEFT, Math.min(ROAD_RIGHT - car.w, car.x));

      // skapa nya hinder då och då
      spawnTimer++;
      if (spawnTimer > 60) { spawnObstacle(); spawnTimer = 0; }

      // flytta hindren nedåt och rita dem
      obstacles.forEach(o => o.y += fallSpeed);
      obstacles = obstacles.filter(o => o.y < H);
      obstacles.forEach(o => drawCar(o.x, o.y, "#ef476f"));

      // krock-check
      for (const o of obstacles) {
        if (rectsOverlap(car, o)) {
          over = true;
          scoreEl.textContent = "Krasch! Poäng: " + score + " — tryck Börja om";
          document.getElementById("reset").style.display = "inline-flex";
          return;
        }
      }

      drawCar(car.x, car.y, "#ffd166");

      // poäng ökar med tiden, spelet blir snabbare
      score++;
      scoreEl.textContent = "Poäng: " + score;
      if (score % 300 === 0) fallSpeed += 0.5;

      requestAnimationFrame(loop);
    }

    // Tangentbord
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
    });
    window.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
    });

    // Pekknappar för mobilen — samma "keys" som tangentbordet använder
    function bindHoldButton(el, key) {
      el.addEventListener("pointerdown", e => { e.preventDefault(); keys[key] = true; });
      el.addEventListener("pointerup", () => { keys[key] = false; });
      el.addEventListener("pointerleave", () => { keys[key] = false; });
    }
    bindHoldButton(document.getElementById("left"), "left");
    bindHoldButton(document.getElementById("right"), "right");

    // Börja om-knappen startar spelet på nytt
    document.getElementById("reset").addEventListener("click", () => {
      obstacles = [];
      score = 0;
      fallSpeed = 4;
      car.x = W / 2 - car.w / 2;
      over = false;
      document.getElementById("reset").style.display = "none";
      loop();
    });

    loop();
  </script>
</body>
</html>
