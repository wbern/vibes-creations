<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tre i rad</title>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; overscroll-behavior: none; }
    body {
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    :root {
      --bg: #e3eef4; --ink: #0f2a3a; --card: #ffffff;
      --accent: #1e7fb0; --accent-2: #ffd166;
      --radius: 16px; --lip: 6px;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    h1 { font: 900 2.2rem/1.05 system-ui, sans-serif; letter-spacing: -0.02em; margin: 0 0 .5rem; }
    .page { max-width: 28rem; margin: 0 auto; padding: 1.25rem; box-sizing: border-box; text-align: center; }
    .stack { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
    .card {
      background: var(--card); border-radius: var(--radius); padding: 1rem 1.25rem;
      box-shadow: 0 var(--lip) 0 color-mix(in srgb, var(--ink) 14%, transparent);
    }
    .btn-chunky {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 56px; padding: 14px 22px; border: 0; border-radius: var(--radius);
      font: 800 18px/1 system-ui, sans-serif; color: #fff; letter-spacing: .5px;
      text-transform: uppercase; background: var(--c, var(--accent));
      box-shadow: 0 var(--lip) 0 color-mix(in srgb, var(--c, var(--accent)) 70%, black);
      cursor: pointer; transition: transform 80ms, box-shadow 80ms;
    }
    .btn-chunky:active { transform: translateY(var(--lip)); box-shadow: 0 0 0 transparent; }
    #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(80vw, 320px); }
    .cell {
      aspect-ratio: 1; background: var(--card); border-radius: 12px; border: 0;
      box-shadow: 0 6px 0 color-mix(in srgb, var(--ink) 14%, transparent);
      font: 900 3rem/1 system-ui, sans-serif; display: grid; place-items: center;
      cursor: pointer;
    }
    #status { font: 800 1.2rem/1.2 system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="page stack">
    <h1>Tre i rad</h1>
    <p id="status">X:s tur</p>
    <div id="board"></div>
    <button class="btn-chunky pop" id="reset" style="--c:#ffd166">Börja om</button>
  </div>

  <script>
    // Spelbrädet: 9 rutor, tom sträng = ledig ruta.
    let board = Array(9).fill("");
    let turn = "X"; // vem sin tur det är
    let gameOver = false;

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");

    // Alla sätt att vinna: rader, kolumner, diagonaler
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function checkWinner() {
      for (const [a,b,c] of WINS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a];
        }
      }
      if (board.every(cell => cell)) return "draw"; // alla rutor fulla = oavgjort
      return null;
    }

    function render() {
      boardEl.innerHTML = "";
      board.forEach((val, i) => {
        const cell = document.createElement("button");
        cell.className = "cell pop";
        cell.textContent = val;
        cell.style.color = val === "X" ? "var(--accent)" : "var(--accent-2)";
        cell.addEventListener("click", () => makeMove(i));
        boardEl.appendChild(cell);
      });
    }

    function makeMove(i) {
      if (gameOver || board[i]) return; // ruta upptagen eller spelet slut
      board[i] = turn;
      const winner = checkWinner();
      if (winner === "draw") {
        statusEl.textContent = "Oavgjort!";
        gameOver = true;
      } else if (winner) {
        statusEl.textContent = winner + " vinner! 🎉";
        gameOver = true;
      } else {
        turn = turn === "X" ? "O" : "X";
        statusEl.textContent = turn + ":s tur";
      }
      render();
    }

    document.getElementById("reset").addEventListener("click", () => {
      board = Array(9).fill("");
      turn = "X";
      gameOver = false;
      statusEl.textContent = "X:s tur";
      render();
    });

    render();
  </script>
</body>
</html>
