<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ekorren Nilsson vs Monstren</title>
  <style>
    html, body { margin: 0; padding: 0; background: #05021a; overflow: hidden; height: 100%; }
    canvas { display: block; touch-action: none; }
    #ui {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 14px; pointer-events: none;
    }
    .ctrl-btn {
      pointer-events: all; width: 70px; height: 70px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.15);
      color: #fff; font-size: 26px; display: flex; align-items: center;
      justify-content: center; cursor: pointer;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.35); transform: scale(0.91); }
    #dpad { display: flex; flex-direction: column; gap: 8px; }
    #shoot-btn { width: 90px; height: 90px; background: rgba(220,100,20,0.78); border: 3px solid #ff9944; font-size: 34px; }
    #score-display { position:fixed; top:12px; left:12px; color:#fff; font:900 20px system-ui; text-shadow:0 2px 6px #000; pointer-events:none; }
    #lives-display { position:fixed; top:12px; right:12px; color:#ff5555; font:900 22px system-ui; text-shadow:0 2px 6px #000; pointer-events:none; }
    #pw-txt { position:fixed; top:48px; left:12px; color:#ffe566; font:700 15px system-ui; text-shadow:0 2px 6px #000; pointer-events:none; }
    #overlay {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,0.75); color:#fff; font-family:system-ui;
      text-align:center; padding:1.5rem;
    }
    #overlay h1 { font-size:2.4rem; margin:0 0 .4rem; }
    #overlay p  { font-size:1.05rem; margin:0 0 1.4rem; color:#ccc; line-height:1.6; }
    .start-btn {
      padding:16px 44px; font:900 20px system-ui; background:#ff7a2a;
      color:#fff; border:none; border-radius:16px; cursor:pointer;
      box-shadow:0 6px 0 #a03800; touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .start-btn:active { transform:translateY(4px); box-shadow:0 2px 0 #a03800; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score-display">Poäng: <span id="score">0</span></div>
<div id="lives-display">❤️❤️❤️</div>
<div id="pw-txt"></div>
<div id="ui">
  <div id="dpad">
    <div class="ctrl-btn" id="btn-up">⬆️</div>
    <div class="ctrl-btn" id="btn-down">⬇️</div>
  </div>
  <div class="ctrl-btn" id="shoot-btn">🌰</div>
</div>
<div id="overlay">
  <h1>🐿️ Ekorren Nilsson</h1>
  <p>Hoppa på grenarna med ▲▼<br>Skjut ekollon med 🌰 eller mellanslag<br>
  Stenar 🪨 stoppar dina ekollon — akta dig!<br>
  Samla power-ups för att bli starkare.</p>
  <button class="start-btn" id="start-btn">SPELA!</button>
</div>

<script>
// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener("resize", resize);
const GW = () => canvas.width;
const GH = () => canvas.height;

// ── Physics constants ─────────────────────────────────────────────────────────
const GRAVITY   = 0.48;
const JUMP_V    = -12.5;
const FAST_FALL = 3;

// ── Branches (4 platforms on the left side of screen) ────────────────────────
// Returns branch Y-positions based on current screen height
function getBranchYs() {
  const gh = GH();
  // 6 branches, ~90px apart so the squirrel can jump between them
  return [gh-82, gh-172, gh-265, gh-358, gh-450, gh-540];
}

// ── Game state ────────────────────────────────────────────────────────────────
let score=0, lives=3, running=false, frame=0;
let powerup={type:null, timer:0};
let acorns=[], monsters=[], stones=[], trees=[], hearts=[], drops=[], particles=[], stars=[];
// When dropping through a branch, skip that branch's collision for a few frames
let skipBranchY=null, skipBranchTimer=0;

// ── Squirrel ──────────────────────────────────────────────────────────────────
const sq = {
  x:70, y:300, w:44, h:44,
  vy:0, onGround:false,
  movingUp:false, movingDown:false, shooting:false
};

// ── Stars ─────────────────────────────────────────────────────────────────────
function initStars() {
  stars = Array.from({length:65}, () => ({
    x:Math.random(), y:Math.random(),
    r:Math.random()*1.5+0.5, speed:Math.random()*0.3+0.1
  }));
}
initStars();

// ── Controls ──────────────────────────────────────────────────────────────────
function btn(id, dn, up) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e => { e.preventDefault(); dn(); });
  el.addEventListener("pointerup",   e => { e.preventDefault(); up(); });
  el.addEventListener("pointerout",  ()=> up());
}
btn("btn-up",   () => { if(sq.onGround) { sq.vy=JUMP_V; sq.onGround=false; } }, () => {});
btn("btn-down", () => {
  if (sq.onGround) {
    // drop through current branch
    const cur = getBranchYs().find(by => Math.abs(sq.y+sq.h - by) < 6);
    if (cur != null) { skipBranchY=cur; skipBranchTimer=22; }
    sq.vy=4; sq.onGround=false;
  } else {
    sq.vy=Math.max(sq.vy, FAST_FALL);
  }
}, () => {});

const shootBtn = document.getElementById("shoot-btn");
shootBtn.addEventListener("pointerdown", e => { e.preventDefault(); sq.shooting=true; });
shootBtn.addEventListener("pointerup",   e => { e.preventDefault(); sq.shooting=false; });
shootBtn.addEventListener("pointerout",  ()=> sq.shooting=false);

addEventListener("keydown", e => {
  if (!running) return;
  if (e.key==="ArrowUp"   || e.key==="w" || e.key==="W") { if(sq.onGround){sq.vy=JUMP_V; sq.onGround=false;} e.preventDefault(); }
  if (e.key==="ArrowDown" || e.key==="s" || e.key==="S") {
    if (sq.onGround) {
      const cur=getBranchYs().find(by=>Math.abs(sq.y+sq.h-by)<6);
      if(cur!=null){skipBranchY=cur;skipBranchTimer=22;}
      sq.vy=4; sq.onGround=false;
    } else { sq.vy=Math.max(sq.vy,FAST_FALL); }
    e.preventDefault();
  }
  if (e.key===" " || e.key==="ArrowRight") { sq.shooting=true; e.preventDefault(); }
});
addEventListener("keyup", e => {
  if (e.key===" " || e.key==="ArrowRight") sq.shooting=false;
});

// ── Shooting ──────────────────────────────────────────────────────────────────
let lastShot=0;
function shoot() {
  const cd = powerup.type==="rapid" ? 130 : 380;
  if (Date.now()-lastShot < cd) return;
  lastShot = Date.now();
  const offsets = powerup.type==="triple" ? [-14,0,14] : [0];
  offsets.forEach(dy => {
    acorns.push({
      x: sq.x+sq.w+4, y: sq.y+sq.h/2+dy,
      r: powerup.type==="big" ? 12 : 7,
      speed: powerup.type==="big" ? 8 : 13,
      big: powerup.type==="big"
    });
  });
}

// ── Monsters (5 types) ────────────────────────────────────────────────────────
// name, color, hp, speed, w, h, pts, pattern
const MTYPES = [
  { name:"slime",   color:"#33ee55", hp:3,  speed:1.3, w:36,h:36, pts:10,  pat:"line"   },
  { name:"bat",     color:"#bb77ff", hp:5,  speed:2.4, w:34,h:28, pts:20,  pat:"wave"   },
  { name:"skull",   color:"#ff4444", hp:8,  speed:1.1, w:42,h:42, pts:35,  pat:"line"   },
  { name:"ghost",   color:"#88ffee", hp:10, speed:1.8, w:36,h:40, pts:45,  pat:"wave"   },
  { name:"orc",     color:"#ff9933", hp:6,  speed:3.2, w:40,h:40, pts:30,  pat:"charge" },
  // New monsters:
  { name:"troll",   color:"#5a9a3a", hp:15, speed:0.7, w:54,h:56, pts:60,  pat:"line"   }, // huge & tough
  { name:"spider",  color:"#220022", hp:6,  speed:2.0, w:44,h:36, pts:40,  pat:"zigzag" }, // zigzag movement
  { name:"vampire", color:"#880022", hp:12, speed:2.8, w:38,h:42, pts:55,  pat:"dive"   }, // swoops at squirrel
];

function spawnMonster() {
  // unlock one more monster type every 30 pts — all 8 appear within the first few minutes
  const diff  = Math.min(Math.floor(score/30), MTYPES.length-1);
  const pool  = MTYPES.slice(0, diff+1);
  const t     = pool[Math.floor(Math.random()*pool.length)];
  const bys   = getBranchYs();
  // Monsters prefer branch heights so they come at the squirrel's level
  const targetY = bys[Math.floor(Math.random()*bys.length)] - t.h;
  monsters.push({
    ...t, hp:t.hp, maxHp:t.hp,
    x: GW()+10, y: targetY,
    phase: Math.random()*Math.PI*2,
    baseY: targetY
  });
}

// ── Stones ────────────────────────────────────────────────────────────────────
function spawnStone() {
  const bys = getBranchYs();
  // Stones spawn between or at branch heights (not at ground level)
  const by  = bys[Math.floor(Math.random()*(bys.length-1))+1]; // branches 1-3
  const h   = 40 + Math.floor(Math.random()*40);
  const w   = 50 + Math.floor(Math.random()*50);
  const stoneHp = 3 + Math.floor(Math.random()*3); // 3–5 HP
  stones.push({
    x: GW()+10, y: by-h,
    w, h,
    speed: 1.2 + Math.random()*0.8,
    hp: stoneHp, maxHp: stoneHp
  });
}

// ── Trees (indestructible, very rare) ────────────────────────────────────────
function spawnTree() {
  const w = 70 + Math.floor(Math.random()*40);
  const h = 160 + Math.floor(Math.random()*80);
  trees.push({ x: GW()+10, y: GH()-68-h, w, h, speed: 1.0 });
}

// ── Hearts (life pickups — shoot or touch to collect) ─────────────────────────
function spawnHeart() {
  const y = 90 + Math.random() * (GH()-240);
  hearts.push({ x: GW()+10, y, r:18, speed: 1.4, bob: Math.random()*Math.PI*2 });
}

// ── Power-up drops ────────────────────────────────────────────────────────────
const PUTYPES = [
  { type:"rapid",  color:"#ffee22", icon:"⚡", label:"⚡ SNABBSKOTT  8 sek!" },
  { type:"big",    color:"#ff8833", icon:"💥", label:"💥 JÄTTEEKOLLON 8 sek!" },
  { type:"triple", color:"#33ddff", icon:"🔱", label:"🔱 TRE EKOLLON  8 sek!" },
];
function tryDrop(x,y) {
  if (Math.random()>0.28) return;
  const pu = PUTYPES[Math.floor(Math.random()*PUTYPES.length)];
  drops.push({ x, y, pu, vy:1.2, r:18 });
}
function applyPU(pu) {
  powerup={type:pu.type, timer:480};
  document.getElementById("pw-txt").textContent=pu.label;
}

// ── Particles ─────────────────────────────────────────────────────────────────
function burst(x,y,color,n=10) {
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, v=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:3+Math.random()*4,color,life:40});
  }
}

// ── Draw: background ──────────────────────────────────────────────────────────
function drawBg() {
  const g=ctx.createLinearGradient(0,0,0,GH());
  g.addColorStop(0,"#05021a"); g.addColorStop(1,"#0e1f08");
  ctx.fillStyle=g; ctx.fillRect(0,0,GW(),GH());
  // stars
  stars.forEach(s => {
    s.x -= s.speed/GW(); if(s.x<0) s.x=1;
    ctx.globalAlpha=0.4+0.6*Math.sin(frame*0.04+s.x*10);
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(s.x*GW(), s.y*GH()*0.6, s.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
  // background trees (silhouettes)
  ctx.fillStyle="#0c1a06";
  for (let tx=-30;tx<GW();tx+=90) {
    const h=80+(tx*7%55);
    ctx.beginPath();ctx.moveTo(tx,GH()-68);ctx.lineTo(tx+32,GH()-68-h);ctx.lineTo(tx+64,GH()-68);ctx.fill();
  }
  // ground
  ctx.fillStyle="#1a3408"; ctx.fillRect(0,GH()-68,GW(),68);
  ctx.fillStyle="#265510"; ctx.fillRect(0,GH()-70,GW(),8);
}

// ── Draw: branches ────────────────────────────────────────────────────────────
function drawBranches() {
  const bys = getBranchYs();
  const BW  = 210; // branch width in pixels
  bys.forEach((by,i) => {
    // shadow
    ctx.fillStyle="rgba(0,0,0,0.3)";
    ctx.fillRect(10, by+12, BW, 14);
    // plank (brown wood)
    ctx.fillStyle="#6b3a1f";
    ctx.fillRect(10, by, BW, 14);
    // top highlight
    ctx.fillStyle="#9b5a2f";
    ctx.fillRect(10, by, BW, 4);
    // bark lines
    ctx.strokeStyle="#4a2810"; ctx.lineWidth=1.5;
    for (let lx=30;lx<BW;lx+=22) {
      ctx.beginPath(); ctx.moveTo(lx,by+2); ctx.lineTo(lx,by+13); ctx.stroke();
    }
    // leaves on left end
    const lcolors=["#2d7a1a","#3a9a22","#226b14"];
    for (let li=0;li<5;li++) {
      ctx.fillStyle=lcolors[li%3];
      const lx=14+li*12, ly=by-(4+li%3*4);
      ctx.beginPath(); ctx.ellipse(lx,ly,10,7,-0.3,0,Math.PI*2); ctx.fill();
    }
  });
}

// ── Draw: squirrel ────────────────────────────────────────────────────────────
function drawSquirrel(x,y) {
  const cx=x+22, cy=y+22;
  // tail
  ctx.strokeStyle="#b06820"; ctx.lineWidth=11; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(cx-14,cy+10);
  ctx.quadraticCurveTo(cx-42,cy-8,cx-22,cy-28); ctx.stroke();
  // body
  ctx.fillStyle="#c07828";
  ctx.beginPath(); ctx.ellipse(cx,cy+4,18,20,0,0,Math.PI*2); ctx.fill();
  // head
  ctx.fillStyle="#d98838";
  ctx.beginPath(); ctx.ellipse(cx+10,cy-12,14,13,0.3,0,Math.PI*2); ctx.fill();
  // ear
  ctx.fillStyle="#c07828";
  ctx.beginPath(); ctx.ellipse(cx+5,cy-24,5,8,-0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#ffaaaa";
  ctx.beginPath(); ctx.ellipse(cx+5,cy-24,3,5,-0.4,0,Math.PI*2); ctx.fill();
  // eye
  ctx.fillStyle="#111";
  ctx.beginPath(); ctx.arc(cx+16,cy-15,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath(); ctx.arc(cx+17,cy-16,1.4,0,Math.PI*2); ctx.fill();
  // nose
  ctx.fillStyle="#333";
  ctx.beginPath(); ctx.arc(cx+23,cy-11,2.5,0,Math.PI*2); ctx.fill();
}

// ── Draw: monster ─────────────────────────────────────────────────────────────
function drawMonster(m) {
  const cx=m.x+m.w/2, cy=m.y+m.h/2;
  const bob=Math.sin(frame*0.1+m.phase)*3;

  if (m.name==="slime") {
    ctx.fillStyle=m.color;
    ctx.beginPath(); ctx.ellipse(cx,cy+bob,m.w/2,m.h/2,0,0,Math.PI*2); ctx.fill();
    // mouth
    ctx.strokeStyle="#006622"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy+4+bob,7,0.2,Math.PI-0.2); ctx.stroke();
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.ellipse(cx-8,cy-5+bob,5,7,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+8,cy-5+bob,5,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#111";
    ctx.beginPath(); ctx.ellipse(cx-8,cy-3+bob,3,4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+8,cy-3+bob,3,4,0,0,Math.PI*2); ctx.fill();

  } else if (m.name==="bat") {
    ctx.fillStyle="#6622aa";
    ctx.beginPath(); ctx.ellipse(cx-22,cy+bob,20,9,-0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+22,cy+bob,20,9, 0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=m.color;
    ctx.beginPath(); ctx.ellipse(cx,cy+bob,14,13,0,0,Math.PI*2); ctx.fill();
    // fangs
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.moveTo(cx-4,cy+5+bob); ctx.lineTo(cx-2,cy+12+bob); ctx.lineTo(cx,cy+5+bob); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+1,cy+5+bob);  ctx.lineTo(cx+3,cy+12+bob); ctx.lineTo(cx+5,cy+5+bob); ctx.fill();
    ctx.fillStyle="#ff0000";
    ctx.beginPath(); ctx.arc(cx-5,cy-4+bob,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+5,cy-4+bob,3.5,0,Math.PI*2); ctx.fill();

  } else if (m.name==="skull") {
    ctx.fillStyle=m.color;
    ctx.beginPath(); ctx.ellipse(cx,cy+bob,m.w/2,m.h/2-3,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#1a0000";
    ctx.beginPath(); ctx.ellipse(cx-7,cy-4+bob,7,7,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+7,cy-4+bob,7,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#ff1111";
    ctx.beginPath(); ctx.arc(cx-7,cy-4+bob,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+7,cy-4+bob,3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff";
    for(let i=-2;i<=2;i++) ctx.fillRect(cx+i*5-2,cy+10+bob,4,7);
    // cracks
    ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(cx,cy-8+bob); ctx.lineTo(cx+4,cy+2+bob); ctx.stroke();

  } else if (m.name==="ghost") {
    // semi-transparent ghost
    ctx.globalAlpha=0.72;
    ctx.fillStyle=m.color;
    ctx.beginPath(); ctx.ellipse(cx,cy-4+bob,m.w/2,m.h/2-4,0,0,Math.PI*2); ctx.fill();
    // wavy bottom
    ctx.beginPath(); ctx.moveTo(m.x,cy+12+bob);
    for(let wx=0;wx<=m.w;wx+=8) {
      ctx.quadraticCurveTo(m.x+wx+4,cy+18+bob+Math.sin(frame*0.15+wx)*5, m.x+wx+8, cy+12+bob);
    }
    ctx.fill();
    ctx.globalAlpha=1;
    // glowing eyes
    ctx.fillStyle="#0055cc";
    ctx.beginPath(); ctx.ellipse(cx-7,cy-5+bob,5,7,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+7,cy-5+bob,5,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#aaddff";
    ctx.beginPath(); ctx.arc(cx-7,cy-6+bob,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+7,cy-6+bob,2,0,Math.PI*2); ctx.fill();

  } else if (m.name==="orc") {
    ctx.fillStyle=m.color;
    ctx.beginPath(); ctx.ellipse(cx,cy+bob,m.w/2,m.h/2,0,0,Math.PI*2); ctx.fill();
    // tusks
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.moveTo(cx-8,cy+6+bob); ctx.lineTo(cx-6,cy+16+bob); ctx.lineTo(cx-3,cy+6+bob); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+3,cy+6+bob);  ctx.lineTo(cx+5,cy+16+bob); ctx.lineTo(cx+8,cy+6+bob); ctx.fill();
    // eyes (angry)
    ctx.fillStyle="#cc2200";
    ctx.beginPath(); ctx.arc(cx-7,cy-5+bob,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+7,cy-5+bob,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#ff4400";
    ctx.beginPath(); ctx.arc(cx-7,cy-5+bob,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+7,cy-5+bob,2,0,Math.PI*2); ctx.fill();
    // angry eyebrows
    ctx.strokeStyle="#7a2200"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx-11,cy-11+bob); ctx.lineTo(cx-3,cy-8+bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+3, cy-8+bob);  ctx.lineTo(cx+11,cy-11+bob); ctx.stroke();

  } else if (m.name==="troll") {
    ctx.globalAlpha=1;
    // big round body
    ctx.fillStyle=m.color;
    ctx.beginPath(); ctx.ellipse(cx,cy+bob,m.w/2,m.h/2,0,0,Math.PI*2); ctx.fill();
    // arms
    ctx.fillStyle="#4a8030";
    ctx.beginPath(); ctx.ellipse(cx-m.w/2-8,cy+4+bob,10,18,0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+m.w/2+8,cy+4+bob,10,18,-0.3,0,Math.PI*2); ctx.fill();
    // face
    ctx.fillStyle="#3a6a25";
    ctx.beginPath(); ctx.ellipse(cx,cy-6+bob,m.w/2-4,m.h/2-10,0,0,Math.PI*2); ctx.fill();
    // tiny angry eyes
    ctx.fillStyle="#ffff00";
    ctx.beginPath(); ctx.arc(cx-10,cy-10+bob,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+10,cy-10+bob,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#000";
    ctx.beginPath(); ctx.arc(cx-10,cy-10+bob,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+10,cy-10+bob,2.5,0,Math.PI*2); ctx.fill();
    // nose wart
    ctx.fillStyle="#2a5018";
    ctx.beginPath(); ctx.arc(cx,cy-2+bob,5,0,Math.PI*2); ctx.fill();
    // mouth / grin
    ctx.strokeStyle="#1a3a0a"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,cy+8+bob,10,0.1,Math.PI-0.1); ctx.stroke();

  } else if (m.name==="spider") {
    ctx.globalAlpha=1;
    // 8 legs
    ctx.strokeStyle="#440066"; ctx.lineWidth=2.5; ctx.lineCap="round";
    const legAngles=[-0.8,-0.4,0.4,0.8];
    legAngles.forEach(a => {
      // top legs
      ctx.beginPath(); ctx.moveTo(cx-2,cy+bob); ctx.lineTo(cx-2-Math.cos(a)*28,cy+bob-Math.sin(a)*20); ctx.stroke();
      // bottom legs
      ctx.beginPath(); ctx.moveTo(cx+2,cy+bob); ctx.lineTo(cx+2+Math.cos(a)*28,cy+bob-Math.sin(a)*20); ctx.stroke();
    });
    // body parts (abdomen + head)
    ctx.fillStyle="#330044";
    ctx.beginPath(); ctx.ellipse(cx,cy+6+bob,14,16,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=m.color;
    ctx.beginPath(); ctx.ellipse(cx,cy-8+bob,11,11,0,0,Math.PI*2); ctx.fill();
    // 6 red eyes
    ctx.fillStyle="#ff0000";
    [[-6,-12],[-0,-10],[6,-12],[-8,-8],[8,-8],[0,-6]].forEach(([ex,ey])=>{
      ctx.beginPath(); ctx.arc(cx+ex,cy+ey+bob,2,0,Math.PI*2); ctx.fill();
    });
    // fangs
    ctx.fillStyle="#660088";
    ctx.beginPath(); ctx.moveTo(cx-4,cy-3+bob); ctx.lineTo(cx-3,cy+4+bob); ctx.lineTo(cx,cy-3+bob); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx,cy-3+bob);   ctx.lineTo(cx+3,cy+4+bob); ctx.lineTo(cx+4,cy-3+bob); ctx.fill();

  } else if (m.name==="vampire") {
    ctx.globalAlpha=1;
    // cape (dark red wings)
    ctx.fillStyle="#550011";
    ctx.beginPath();
    ctx.moveTo(cx,cy+8+bob);
    ctx.quadraticCurveTo(cx-34,cy+bob,cx-26,cy-18+bob);
    ctx.quadraticCurveTo(cx-10,cy-6+bob,cx,cy-2+bob);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx,cy+8+bob);
    ctx.quadraticCurveTo(cx+34,cy+bob,cx+26,cy-18+bob);
    ctx.quadraticCurveTo(cx+10,cy-6+bob,cx,cy-2+bob);
    ctx.fill();
    // body
    ctx.fillStyle=m.color;
    ctx.beginPath(); ctx.ellipse(cx,cy+2+bob,13,18,0,0,Math.PI*2); ctx.fill();
    // head
    ctx.fillStyle="#cc0033";
    ctx.beginPath(); ctx.ellipse(cx,cy-14+bob,11,12,0,0,Math.PI*2); ctx.fill();
    // collar
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.ellipse(cx,cy-2+bob,8,4,0,0,Math.PI*2); ctx.fill();
    // glowing eyes
    ctx.fillStyle="#ff0000";
    ctx.beginPath(); ctx.arc(cx-5,cy-16+bob,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+5,cy-16+bob,3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#ffaaaa";
    ctx.beginPath(); ctx.arc(cx-5,cy-17+bob,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+5,cy-17+bob,1.5,0,Math.PI*2); ctx.fill();
    // fangs
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.moveTo(cx-4,cy-9+bob); ctx.lineTo(cx-3,cy-3+bob); ctx.lineTo(cx-1,cy-9+bob); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+1,cy-9+bob); ctx.lineTo(cx+3,cy-3+bob); ctx.lineTo(cx+4,cy-9+bob); ctx.fill();
  }

  // HP bar (all monsters)
  const bw=m.w+8;
  ctx.globalAlpha=1;
  ctx.fillStyle="#222"; ctx.fillRect(m.x-4,m.y-14,bw,6);
  ctx.fillStyle=m.hp>m.maxHp/2?"#44ff44":"#ff4444";
  ctx.fillRect(m.x-4,m.y-14,bw*(m.hp/m.maxHp),6);
}

// ── Draw: stone ───────────────────────────────────────────────────────────────
function drawStone(s) {
  // shadow
  ctx.fillStyle="rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(s.x+s.w/2,s.y+s.h+6,s.w/2*0.8,7,0,0,Math.PI*2); ctx.fill();
  // main rock body — several overlapping ellipses for a craggy look
  ctx.fillStyle="#777";
  ctx.beginPath(); ctx.ellipse(s.x+s.w/2,s.y+s.h/2,s.w/2,s.h/2,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#888";
  ctx.beginPath(); ctx.ellipse(s.x+s.w*0.4,s.y+s.h*0.4,s.w*0.36,s.h*0.36,-0.2,0,Math.PI*2); ctx.fill();
  // highlight
  ctx.fillStyle="rgba(255,255,255,0.15)";
  ctx.beginPath(); ctx.ellipse(s.x+s.w*0.35,s.y+s.h*0.3,s.w*0.18,s.h*0.14,0,0,Math.PI*2); ctx.fill();
  // cracks
  ctx.strokeStyle="rgba(0,0,0,0.35)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(s.x+s.w*0.5,s.y+s.h*0.2); ctx.lineTo(s.x+s.w*0.65,s.y+s.h*0.55); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s.x+s.w*0.35,s.y+s.h*0.55); ctx.lineTo(s.x+s.w*0.55,s.y+s.h*0.8); ctx.stroke();
  // HP bar
  if (s.hp < s.maxHp) {
    ctx.fillStyle="#333"; ctx.fillRect(s.x, s.y-12, s.w, 7);
    ctx.fillStyle="#88aaff"; ctx.fillRect(s.x, s.y-12, s.w*(s.hp/s.maxHp), 7);
  }
}

// ── Draw: tree (indestructible) ───────────────────────────────────────────────
function drawTree(t) {
  const cx = t.x + t.w/2;
  // trunk
  ctx.fillStyle="#5a3010";
  ctx.fillRect(cx-10, t.y+t.h*0.55, 20, t.h*0.45);
  // three triangle layers (pine tree)
  const layers = 3;
  for (let i=0;i<layers;i++) {
    const ly  = t.y + (t.h*0.5/layers)*i;
    const lh  = t.h*0.5 - (t.h*0.1/layers)*i;
    const lw  = (t.w/2+10) - i*8;
    ctx.fillStyle = i===0 ? "#1a5010" : i===1 ? "#236618" : "#2d7a20";
    ctx.beginPath();
    ctx.moveTo(cx, ly);
    ctx.lineTo(cx-lw, ly+lh);
    ctx.lineTo(cx+lw, ly+lh);
    ctx.closePath(); ctx.fill();
  }
  // glow outline to signal "indestructible"
  ctx.strokeStyle="rgba(255,80,80,0.35)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(cx, t.y); ctx.lineTo(cx-t.w/2-10, t.y+t.h*0.55); ctx.lineTo(cx+t.w/2+10, t.y+t.h*0.55); ctx.closePath(); ctx.stroke();
}

// ── Draw: heart pickup ────────────────────────────────────────────────────────
function drawHeart(h) {
  const hy = h.y + Math.sin(h.bob)*8;
  ctx.save();
  ctx.shadowColor="#ff2255"; ctx.shadowBlur=18;
  ctx.fillStyle="#ff3366";
  // heart shape using two arcs
  const s=h.r*0.55;
  ctx.beginPath();
  ctx.moveTo(h.x, hy+s*0.6);
  ctx.bezierCurveTo(h.x-s*2, hy-s*0.6, h.x-s*2, hy-s*2, h.x, hy-s*0.8);
  ctx.bezierCurveTo(h.x+s*2, hy-s*2, h.x+s*2, hy-s*0.6, h.x, hy+s*0.6);
  ctx.fill();
  ctx.restore();
  // highlight
  ctx.fillStyle="rgba(255,255,255,0.4)";
  ctx.beginPath(); ctx.ellipse(h.x-s*0.5, hy-s*0.4, s*0.4, s*0.25, -0.3, 0, Math.PI*2); ctx.fill();
}

// ── Draw: acorn ───────────────────────────────────────────────────────────────
function drawAcorn(a) {
  ctx.fillStyle="#6a4020";
  ctx.beginPath(); ctx.ellipse(a.x,a.y-a.r*0.3,a.r*0.9,a.r*0.55,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#b87030";
  ctx.beginPath(); ctx.ellipse(a.x,a.y+a.r*0.25,a.r*0.75,a.r,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="rgba(255,240,200,0.4)";
  ctx.beginPath(); ctx.ellipse(a.x-a.r*0.2,a.y,a.r*0.2,a.r*0.35,-0.3,0,Math.PI*2); ctx.fill();
}

// ── Draw: power-up drop ───────────────────────────────────────────────────────
function drawDrop(d) {
  ctx.save();
  ctx.shadowColor=d.pu.color; ctx.shadowBlur=20;
  ctx.fillStyle=d.pu.color;
  ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.font="bold 15px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(d.pu.icon,d.x,d.y);
}

// ── Squirrel physics + branch collision ───────────────────────────────────────
function updateSquirrel() {
  if (sq.shooting) shoot();
  if (sq.movingUp)   { /* handled by jump event */ }
  if (sq.movingDown) { /* fast-fall is one-shot in event */ }

  // gravity
  sq.vy += GRAVITY;
  sq.y  += sq.vy;
  sq.onGround = false;
  if (skipBranchTimer > 0) skipBranchTimer--;

  // land on branches (only when falling)
  if (sq.vy >= 0) {
    getBranchYs().forEach(by => {
      if (skipBranchTimer > 0 && by === skipBranchY) return; // dropping through this one
      const sqBottom = sq.y + sq.h;
      if (sq.x+sq.w > 10 && sq.x < 220 &&
          sqBottom >= by && sqBottom <= by+20) {
        sq.y = by - sq.h;
        sq.vy = 0;
        sq.onGround = true;
      }
    });
    // land on ground
    const ground = GH()-68;
    if (sq.y+sq.h >= ground) { sq.y=ground-sq.h; sq.vy=0; sq.onGround=true; }
  }

  // clamp to screen top
  if (sq.y < 50) { sq.y=50; sq.vy=0; }
}

// ── Game update ───────────────────────────────────────────────────────────────
function updateLives() {
  document.getElementById("lives-display").textContent = "❤️".repeat(Math.max(0,lives));
}

function gameOver() {
  running = false;
  document.getElementById("overlay").innerHTML =
    `<h1>💀 Game Over</h1><p>Du fick <b>${score}</b> poäng!</p>
     <button class="start-btn" onclick="startGame()">SPELA IGEN</button>`;
  document.getElementById("overlay").style.display = "flex";
}

function hitPlayer() {
  lives--; updateLives(); if(lives<=0) gameOver();
}

function update() {
  frame++;
  updateSquirrel();

  // power-up timer
  if (powerup.timer>0) {
    powerup.timer--;
    if (powerup.timer===0) { powerup.type=null; document.getElementById("pw-txt").textContent=""; }
  }

  // spawn monsters
  const mRate = Math.max(36, 130-Math.floor(score/100)*9);
  if (frame % mRate === 0) spawnMonster();

  // spawn stones
  const sRate = Math.max(200, 420-Math.floor(score/50)*15);
  if (frame % sRate === 0) spawnStone();
  // trees are very rare — about every 20 seconds
  if (frame % 1200 === 0 && frame > 0) spawnTree();
  // hearts spawn occasionally
  if (frame % 540 === 0 && frame > 0) spawnHeart();

  // move acorns — stop at stones (ghost ignores stones, acorns don't)
  acorns = acorns.filter(a => {
    a.x += a.speed;
    if (a.x > GW()+20) return false;
    // stop at stone?
    for (const s of stones) {
      if (a.x+a.r>s.x && a.x-a.r<s.x+s.w && a.y+a.r>s.y && a.y-a.r<s.y+s.h) {
        burst(a.x,a.y,"#aaa",5); return false; // acorn blocked by stone
      }
    }
    return true;
  });

  // move stones — acorns damage them, squirrel takes damage on touch
  stones = stones.filter(s => {
    s.x -= s.speed;
    // acorns chip away at stone
    acorns = acorns.filter(a => {
      if (a.x+a.r>s.x && a.x-a.r<s.x+s.w && a.y+a.r>s.y && a.y-a.r<s.y+s.h) {
        s.hp -= a.big ? 3 : 1;
        burst(a.x, a.y, "#aaa", 4);
        return false; // acorn used up
      }
      return true;
    });
    if (s.hp <= 0) { burst(s.x+s.w/2,s.y+s.h/2,"#888",20); return false; } // stone destroyed!
    // stone hits squirrel?
    if (s.x<sq.x+sq.w-8 && s.x+s.w>sq.x+8 && s.y<sq.y+sq.h-8 && s.y+s.h>sq.y+8) {
      burst(sq.x+sq.w/2,sq.y+sq.h/2,"#999",14);
      hitPlayer(); return false;
    }
    return s.x+s.w > 0;
  });

  // move trees (indestructible — acorns blocked, squirrel loses life)
  trees = trees.filter(t => {
    t.x -= t.speed;
    acorns = acorns.filter(a => {
      if (a.x+a.r>t.x && a.x-a.r<t.x+t.w && a.y+a.r>t.y && a.y-a.r<t.y+t.h) {
        burst(a.x,a.y,"#3a7a20",4); return false;
      }
      return true;
    });
    if (t.x<sq.x+sq.w-8 && t.x+t.w>sq.x+8 && sq.y+sq.h>t.y) {
      burst(sq.x+sq.w/2,sq.y+sq.h/2,"#3a7a20",14); hitPlayer();
    }
    return t.x+t.w > 0;
  });

  // move hearts (shoot or touch to gain a life)
  hearts = hearts.filter(h => {
    h.x -= h.speed;
    h.bob += 0.06;
    const hy = h.y + Math.sin(h.bob)*8;
    // squirrel touches heart
    if (Math.abs(h.x-(sq.x+22))<36 && Math.abs(hy-(sq.y+22))<36) {
      lives = Math.min(lives+1, 6); updateLives();
      burst(h.x,hy,"#ff4466",14); return false;
    }
    // acorn hits heart
    let collected=false;
    acorns=acorns.filter(a=>{
      if(collected) return true;
      if(Math.abs(a.x-h.x)<h.r+a.r && Math.abs(a.y-hy)<h.r+a.r){ collected=true; return false; }
      return true;
    });
    if(collected){ lives=Math.min(lives+1,6); updateLives(); burst(h.x,hy,"#ff4466",14); return false; }
    return h.x+h.r > 0;
  });

  // move drops
  drops = drops.filter(d => {
    d.y += d.vy;
    if (Math.abs(d.x-(sq.x+22))<40 && Math.abs(d.y-(sq.y+22))<40) {
      applyPU(d.pu); burst(d.x,d.y,d.pu.color,14); return false;
    }
    let collected=false;
    acorns=acorns.filter(a=>{
      if(collected) return true;
      if(Math.abs(a.x-d.x)<d.r+a.r && Math.abs(a.y-d.y)<d.r+a.r){ collected=true; return false; }
      return true;
    });
    if(collected){applyPU(d.pu);burst(d.x,d.y,d.pu.color,14);return false;}
    return d.y < GH()-55;
  });

  // move monsters
  monsters = monsters.filter(m => {
    // pattern movement
    if (m.pat==="wave") {
      m.x -= m.speed;
      m.y = m.baseY + Math.sin(frame*0.07+m.phase)*45;
    } else if (m.pat==="charge") {
      m.x -= m.speed;
    } else if (m.pat==="zigzag") {
      // bounces up and down sharply
      m.x -= m.speed;
      m.y += Math.sin(frame*0.18+m.phase)*5;
      m.y = Math.max(55, Math.min(GH()-140, m.y));
    } else if (m.pat==="dive") {
      // vampire homes in on squirrel's Y slowly
      m.x -= m.speed;
      const dy = (sq.y+sq.h/2) - (m.y+m.h/2);
      m.y += Math.sign(dy) * Math.min(Math.abs(dy), 2.5);
    } else {
      m.x -= m.speed; // line / troll
    }

    // hit player?
    if (m.x<sq.x+sq.w-10 && m.x+m.w>sq.x+10 && m.y<sq.y+sq.h-5 && m.y+m.h>sq.y+5) {
      burst(m.x+m.w/2,m.y+m.h/2,m.color,14); hitPlayer(); return false;
    }
    if (m.x+m.w<0) { hitPlayer(); return false; }

    // ghost passes through stones, others don't (just visual)
    // acorn hits monster?
    let alive=true;
    acorns=acorns.filter(a=>{
      if(!alive) return true;
      const hit=a.x+a.r>m.x && a.x-a.r<m.x+m.w && a.y+a.r>m.y && a.y-a.r<m.y+m.h;
      if(hit){
        m.hp -= a.big?3:1;
        burst(a.x,a.y,"#ffcc66",6);
        if(m.hp<=0){
          score+=m.pts; document.getElementById("score").textContent=score;
          burst(m.x+m.w/2,m.y+m.h/2,m.color,18);
          tryDrop(m.x+m.w/2,m.y);
          alive=false;
        }
        return false;
      }
      return true;
    });
    return alive;
  });

  // particles
  particles=particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; return p.life>0;
  });
}

// ── Draw frame ────────────────────────────────────────────────────────────────
function draw() {
  drawBg();
  drawBranches();
  trees.forEach(drawTree);
  hearts.forEach(drawHeart);
  drops.forEach(drawDrop);
  acorns.forEach(drawAcorn);
  stones.forEach(drawStone);
  monsters.forEach(drawMonster);
  drawSquirrel(sq.x, sq.y);
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/40;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // PU timer bar
  if (powerup.timer>0) {
    const pu=PUTYPES.find(p=>p.type===powerup.type);
    ctx.fillStyle="rgba(0,0,0,0.4)"; ctx.fillRect(10,70,160,10);
    ctx.fillStyle=pu?pu.color:"#fff";
    ctx.fillRect(10,70,160*(powerup.timer/480),10);
  }
}

// ── Loop ──────────────────────────────────────────────────────────────────────
function loop() { if(running){update();draw();} requestAnimationFrame(loop); }

// ── Start ─────────────────────────────────────────────────────────────────────
function startGame() {
  score=0; lives=3; frame=0;
  acorns=[]; monsters=[]; stones=[]; trees=[]; hearts=[]; drops=[]; particles=[];
  powerup={type:null,timer:0};
  // start on lowest branch
  const bys=getBranchYs();
  sq.y=bys[0]-sq.h; sq.vy=0; sq.onGround=true; sq.shooting=false;
  running=true;
  document.getElementById("score").textContent="0";
  document.getElementById("pw-txt").textContent="";
  updateLives();
  document.getElementById("overlay").style.display="none";
}

document.getElementById("start-btn").addEventListener("click", startGame);
loop();
</script>
