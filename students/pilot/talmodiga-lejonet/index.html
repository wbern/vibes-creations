<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Klossbanan</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #7ec8e3; overscroll-behavior: none; }
    body {
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: none;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px;
          display: flex; justify-content: space-between; align-items: flex-end; }
    #ui button {
      font-size: 1.5rem; background: rgba(30,30,45,.75); color: #fff; border: 0; border-radius: 12px;
      min-height: 56px; min-width: 56px; touch-action: manipulation;
    }
    #moveBtns { display: flex; gap: 10px; }
    #levelTag {
      position: fixed; top: .6rem; left: 50%; transform: translateX(-50%);
      background: #2b2b2b; color: #fff; font: 800 1.1rem system-ui, sans-serif;
      padding: .3rem .8rem; border-radius: 999px; z-index: 2;
    }
  </style>
</head>
<body>
  <div id="levelTag">Nivå 1</div>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="moveBtns">
      <button id="leftBtn" aria-label="Vänster">←</button>
      <button id="rightBtn" aria-label="Höger">→</button>
    </div>
    <button id="jumpBtn" aria-label="Hoppa">⤒</button>
  </div>
  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    function resize() { c.width = innerWidth; c.height = innerHeight; }
    resize();
    addEventListener("resize", resize);

    // Marken/plattformarna man kan stå på. x är avstånd från start (i pixlar),
    // w = bredd, y = höjd över "golvet" (större y = högre upp i luften).
    const groundY = innerHeight - 80;
    let level = 1;
    const levelTag = document.getElementById("levelTag");

    // Bygger en ny bana slumpmässigt. Fler och krångligare plattformar
    // för varje nivå - men aldrig ett hopp som är omöjligt att klara.
    function generateCourse(lvl) {
      const arr = [{ x: 0, w: 220, y: 0 }];
      let x = 220, y = 0;
      const count = Math.min(4 + lvl, 12);
      for (let i = 0; i < count; i++) {
        const gap = 90 + Math.random() * 50 + Math.min(lvl * 3, 30);
        x += gap;
        const w = Math.max(70, 130 - lvl * 2 + Math.random() * 30);
        y = Math.max(0, Math.min(160, y + (Math.random() * 80 - 40)));
        arr.push({ x, w, y });
        x += w;
      }
      x += 100;
      arr.push({ x, w: 200, y: 0, goal: true });
      return arr;
    }
    let platforms = generateCourse(level);

    // Klossig figur - ett rosa/blått huvud + kropp, som en Roblox-gubbe.
    const player = { x: 40, y: 0, w: 26, h: 46, vx: 0, vy: 0 };

    function drawPlayer(px, py) {
      ctx.fillStyle = "#58a4ff";
      ctx.fillRect(px, py - player.h, player.w, player.h * 0.65);
      ctx.fillStyle = "#f4c99b";
      ctx.fillRect(px + 3, py - player.h - 16, player.w - 6, 18);
    }

    function drawPlatform(p, screenX) {
      ctx.fillStyle = p.goal ? "#ffd166" : "#a06bff";
      ctx.fillRect(screenX, groundY - p.y, p.w, innerHeight - (groundY - p.y));
    }

    // Fysik: tyngdkraften drar neråt hela tiden, precis som i verkligheten.
    const GRAVITY = 0.9, SPEED = 4, JUMP_SPEED = 15;
    let grounded = false, won = false;
    const keys = {};

    function currentPlatform() {
      // Hittar plattformen spelaren står över just nu (om någon).
      return platforms.find(p => player.x + player.w > p.x && player.x < p.x + p.w);
    }

    function updatePlayer() {
      if (won) return;
      player.vx = keys.left ? -SPEED : keys.right ? SPEED : 0;
      player.x += player.vx;

      player.vy -= GRAVITY;
      player.y += player.vy;

      const p = currentPlatform();
      if (p && player.vy <= 0 && player.y <= p.y) {
        player.y = p.y;
        player.vy = 0;
        grounded = true;
        if (p.goal && !won) {
          won = true;
          // Vänta lite så man hinner se vinst-texten, sen bygg nästa nivå.
          setTimeout(() => {
            level++;
            levelTag.textContent = "Nivå " + level;
            platforms = generateCourse(level);
            player.x = 40; player.y = 0; player.vy = 0;
            won = false;
          }, 1300);
        }
      } else {
        grounded = false;
      }

      // Faller man under marken (missade en plattform) - börja om vid start.
      if (groundY - player.y > innerHeight + 100) {
        player.x = 40; player.y = 0; player.vy = 0;
      }
    }

    function jump() {
      if (grounded) { player.vy = JUMP_SPEED; grounded = false; }
    }

    let camX = 0;
    function frame() {
      ctx.clearRect(0, 0, c.width, c.height);
      updatePlayer();
      camX = player.x - innerWidth / 3;
      platforms.forEach(p => drawPlatform(p, p.x - camX));
      drawPlayer(player.x - camX, groundY - player.y);
      if (won) {
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = "#fff";
        ctx.font = "900 26px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Du klarade banan! 🎉", c.width / 2, c.height / 2);
      }
      requestAnimationFrame(frame);
    }
    frame();

    // Styrning: piltangenter/WASD + knappar på skärmen.
    const keyMap = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
    addEventListener("keydown", e => {
      if (keyMap[e.code]) keys[keyMap[e.code]] = true;
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") jump();
    });
    addEventListener("keyup", e => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; });

    function held(id, key) {
      const el = document.getElementById(id);
      el.addEventListener("pointerdown", () => keys[key] = true);
      el.addEventListener("pointerup", () => keys[key] = false);
      el.addEventListener("pointerleave", () => keys[key] = false);
    }
    held("leftBtn", "left");
    held("rightBtn", "right");
    document.getElementById("jumpBtn").addEventListener("pointerdown", jump);
  </script>
</body>
</html>
