<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Odla Trädgården 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    :root { --accent: #3f8a4a; --accent-2: #d97742; --radius: 16px; --lip: 6px; }
    .pill {
      position: fixed; top: .75rem; left: 50%; transform: translateX(-50%);
      padding: .4rem .9rem; background: var(--accent-2); color: #fff;
      border-radius: 999px; font: 700 1rem/1 system-ui, sans-serif; z-index: 5;
    }
    .panel {
      position: fixed; left: 0; right: 0; bottom: 0; max-height: 55%;
      background: #fffdf6; border-radius: 20px 20px 0 0; padding: 1rem;
      box-sizing: border-box; overflow-y: auto; z-index: 6;
      transform: translateY(110%); transition: transform 300ms ease;
    }
    .panel.open { transform: translateY(0); }
    .panel h2 { margin: 0 0 .5rem; text-align: center; }
    .row { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
    .btn-chunky {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      min-width: 64px; padding: .5rem .6rem; border: 0; border-radius: var(--radius);
      font: 700 .8rem/1 system-ui, sans-serif; color: #fff;
      background: var(--c, var(--accent));
      box-shadow: 0 var(--lip) 0 color-mix(in srgb, var(--c, var(--accent)) 70%, black);
    }
    .btn-chunky:active { transform: translateY(var(--lip)); box-shadow: 0 0 0 transparent; }
    .btn-chunky span { font-size: 1.4rem; }
    #closeBtn { display: block; margin: 0 auto; }
    #stick {
      position: fixed; left: 1rem; bottom: 1rem; width: 110px; height: 110px;
      border-radius: 50%; background: rgba(255,255,255,.35); touch-action: none; z-index: 4;
    }
    #stickKnob {
      position: absolute; left: 50%; top: 50%; width: 50px; height: 50px;
      border-radius: 50%; background: rgba(255,255,255,.8);
      transform: translate(-50%, -50%);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <span class="pill" id="coins">💰 20 mynt</span>
  <div class="panel" id="panel">
    <h2 id="panelTitle"></h2>
    <div class="row" id="panelContent"></div>
    <button class="btn-chunky" id="closeBtn" style="--c:#888">Stäng</button>
  </div>
  <!-- On-screen joystick for touch; arrow keys / WASD work too. -->
  <div id="stick"><div id="stickKnob"></div></div>
<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9be7ff);
scene.fog = new THREE.Fog(0x9be7ff, 20, 45);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 9, 11);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(6, 10, 4);
scene.add(sun);

// Grass ground.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x7cc95e })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// A simple house: a box body + a pyramid roof, given a color and an x position.
function makeHouse(bodyColor, roofColor, x, z = -8) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2, 1.6, 1.8),
    new THREE.MeshStandardMaterial({ color: bodyColor })
  );
  body.position.y = 0.8;
  group.add(body);
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(1.7, 1.2, 4),
    new THREE.MeshStandardMaterial({ color: roofColor })
  );
  roof.rotation.y = Math.PI / 4;
  roof.position.y = 2.2;
  group.add(roof);
  group.position.set(x, 0, z);
  group.userData.isHouse = true;
  scene.add(group);
  return group;
}

const houseRed = makeHouse(0xd94f3a, 0x8a2b1f, -6);
const housePink = makeHouse(0xff8ac0, 0xc9448a, -9, 4); // pet house on the opposite side of the map, still in view
const houseBlue = makeHouse(0x3a6fd9, 0x1f3f8a, 6);
houseRed.userData.type = "seeds";
housePink.userData.type = "pets";
houseBlue.userData.type = "sell";

// Squash-and-bounce "press" animation played when the player reaches a house.
function pressHouse(house) {
  const t0 = performance.now();
  function step() {
    const t = (performance.now() - t0) / 250;
    if (t >= 1) { house.scale.set(1, 1, 1); return; }
    const s = 1 - Math.sin(t * Math.PI) * 0.15;
    house.scale.set(1, s, 1);
    requestAnimationFrame(step);
  }
  step();
}

// The blocky Roblox-style player character, built from simple boxes.
const player = new THREE.Group();
const skin = new THREE.MeshStandardMaterial({ color: 0xf2c879 });
const shirt = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
const pants = new THREE.MeshStandardMaterial({ color: 0x3a6fd9 });
const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skin);
head.position.y = 1.55;
const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.35), shirt);
torso.position.y = 0.95;
const legL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.3), pants);
legL.position.set(-0.15, 0.35, 0);
const legR = legL.clone();
legR.position.x = 0.15;
player.add(head, torso, legL, legR);
player.position.set(0, 0, 3);
scene.add(player);
let playerTarget = player.position.clone();
let pendingHouse = null; // house the player is currently walking toward
let coins = 20;

// A little blocky NPC character, colored differently, with its own tiny garden nearby.
function makeNpc(shirtColor, x, z, greeting) {
  const group = new THREE.Group();
  const npcSkin = new THREE.MeshStandardMaterial({ color: 0xf2c879 });
  const npcShirt = new THREE.MeshStandardMaterial({ color: shirtColor });
  const npcPants = new THREE.MeshStandardMaterial({ color: 0x5a3826 });
  const h = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), npcSkin);
  h.position.y = 1.55;
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.35), npcShirt);
  t.position.y = 0.95;
  const lL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.3), npcPants);
  lL.position.set(-0.15, 0.35, 0);
  const lR = lL.clone();
  lR.position.x = 0.15;
  group.add(h, t, lL, lR);
  group.position.set(x, 0, z);
  group.userData.isNpc = true;
  group.userData.greeting = greeting;
  scene.add(group);

  // A tiny 3-plot decorative garden right behind the NPC, with some plants already grown.
  [-0.9, 0, 0.9].forEach((dx, i) => {
    const soil = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.7), soilMat);
    soil.position.set(x + dx, 0.1, z - 1.3);
    scene.add(soil);
    const deco = makePlantMesh(seedTypes[i % seedTypes.length]);
    deco.position.set(x + dx, 0.3, z - 1.3);
    deco.userData.stem.scale.y = 1;
    deco.userData.stem.position.y = 0.5;
    deco.userData.fruit.scale.setScalar(1);
    deco.userData.fruit.position.y = 1.05;
    scene.add(deco);
  });
  return group;
}

// A 3x3 patch of soil the player can plant in, near the spawn point.
const plots = [];
const soilMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2a });
[-2, 0, 2].forEach((x) => {
  [1, -1, -3].forEach((z) => {
    const soil = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.3, 1.5), soilMat);
    soil.position.set(x, 0.15, z);
    soil.userData.isPlot = true;
    scene.add(soil);
    plots.push({ mesh: soil, x, z, state: "empty", plantMesh: null, progress: 0, type: null });
  });
});

const coinsEl = document.getElementById("coins");
const panelEl = document.getElementById("panel");
const panelTitle = document.getElementById("panelTitle");
const panelContent = document.getElementById("panelContent");
function updateCoins() { coinsEl.textContent = "💰 " + coins + " mynt"; }

// Each seed has a cost, how long it takes to grow, and colors for its 3D fruit.
const seedTypes = [
  { name: "Morot", grown: "🥕", cost: 2, reward: 6, growMs: 6000, fruitColor: 0xff8a3d, fruitShape: "cone" },
  { name: "Jordgubbe", grown: "🍓", cost: 4, reward: 10, growMs: 9000, fruitColor: 0xe0405a, fruitShape: "sphere" },
  { name: "Solros", grown: "🌻", cost: 6, reward: 15, growMs: 12000, fruitColor: 0xffd23f, fruitShape: "sphere" },
  { name: "Mango", grown: "🥭", cost: 18, reward: 48, growMs: 18000, fruitColor: 0xffb03d, fruitShape: "sphere" },
  { name: "Vattenmelon", grown: "🍉", cost: 22, reward: 58, growMs: 22000, fruitColor: 0x3fbf5a, fruitShape: "sphere" }
];
let selectedSeed = seedTypes[0];
const basket = []; // harvested plants waiting to be sold at the blue house
const petTypes = [
  { name: "Hund", grown: "🐶", cost: 20 },
  { name: "Katt", grown: "🐱", cost: 30 },
  { name: "Kanin", grown: "🐰", cost: 15 }
];

function openPanel(type) {
  if (type === "seeds") {
    panelTitle.textContent = "🌱 Köp frön";
    panelContent.innerHTML = "";
    seedTypes.forEach((s) => {
      const b = document.createElement("button");
      b.className = "btn-chunky";
      b.style.setProperty("--c", s === selectedSeed ? "#2b2b2b" : "#3f8a4a");
      b.innerHTML = "<span>" + s.grown + "</span>" + s.name + "<br>" + s.cost + "💰";
      b.addEventListener("pointerdown", () => {
        selectedSeed = s;
        openPanel("seeds"); // re-render so the selected seed highlights
      });
      panelContent.appendChild(b);
    });
  } else if (type === "pets") {
    panelTitle.textContent = "🐾 Köp djur";
    panelContent.innerHTML = "";
    petTypes.forEach((p) => {
      const b = document.createElement("button");
      b.className = "btn-chunky";
      b.style.setProperty("--c", "#c9448a");
      b.innerHTML = "<span>" + p.grown + "</span>" + p.name + "<br>" + p.cost + "💰";
      b.addEventListener("pointerdown", () => {
        if (coins >= p.cost) { coins -= p.cost; updateCoins(); }
      });
      panelContent.appendChild(b);
    });
  } else {
    panelTitle.textContent = "💰 Sälj växter";
    panelContent.innerHTML = "";
    if (!basket.length) {
      panelContent.innerHTML = "<p style='text-align:center'>Skörda växter i trädgården för att sälja dem här!</p>";
    } else {
      basket.forEach((item) => {
        const span = document.createElement("span");
        span.style.fontSize = "1.8rem";
        span.textContent = item.grown;
        panelContent.appendChild(span);
      });
      const sellBtn = document.createElement("button");
      sellBtn.className = "btn-chunky";
      sellBtn.style.setProperty("--c", "#3a6fd9");
      sellBtn.style.display = "block";
      sellBtn.style.margin = ".75rem auto 0";
      sellBtn.textContent = "Sälj allt 💰";
      sellBtn.addEventListener("pointerdown", () => {
        coins += basket.reduce((sum, item) => sum + item.reward, 0);
        basket.length = 0;
        updateCoins();
        openPanel("sell");
      });
      panelContent.appendChild(sellBtn);
    }
  }
  panelEl.classList.add("open");
}

document.getElementById("closeBtn").addEventListener("pointerdown", () => {
  panelEl.classList.remove("open");
});

// 5 NPCs spread around the map, each with their own little garden.
makeNpc(0xe0405a, -12, -3, "Hej! Det här är min gård 🍓");
makeNpc(0x58a4ff, 12, -3, "Häftigt att du kom förbi! 🌻");
makeNpc(0x9b59d1, -12, 10, "Titta vad fint mina växter blivit! 🥭");
makeNpc(0xffb03d, 12, 10, "Min gård är den bästa! 😄");
makeNpc(0x3fbf5a, 0, 12, "Kom och odla med mig någon gång! 🍉");

// Build a growing plant mesh for a plot: a green stem, with a colored fruit on top.
function makePlantMesh(type) {
  const group = new THREE.Group();
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.09, 1, 6),
    new THREE.MeshStandardMaterial({ color: 0x3f8a4a })
  );
  stem.position.y = 0.5;
  stem.scale.y = 0.01; // starts as basically a seed poking through the soil
  group.add(stem);
  const fruitGeo = type.fruitShape === "cone"
    ? new THREE.ConeGeometry(0.22, 0.4, 8)
    : new THREE.SphereGeometry(0.22, 10, 10);
  const fruit = new THREE.Mesh(fruitGeo, new THREE.MeshStandardMaterial({ color: type.fruitColor }));
  fruit.scale.setScalar(0.001); // hidden until the plant is grown
  group.add(fruit);
  group.userData = { stem, fruit };
  return group;
}

// Tap a plot: plant the selected seed if empty, or harvest it if ready.
function onPlotTap(plot) {
  if (plot.state === "empty") {
    if (coins < selectedSeed.cost) return;
    coins -= selectedSeed.cost;
    updateCoins();
    plot.state = "growing";
    plot.type = selectedSeed;
    plot.progress = 0;
    plot.plantMesh = makePlantMesh(selectedSeed);
    plot.plantMesh.position.set(plot.x, 0.3, plot.z);
    scene.add(plot.plantMesh);
  } else if (plot.state === "ready") {
    basket.push(plot.type);
    scene.remove(plot.plantMesh);
    plot.plantMesh = null;
    plot.state = "empty";
    plot.type = null;
  }
}

// Growth tick — every 250ms, grow the stem taller, then fade the fruit in.
setInterval(() => {
  plots.forEach((plot) => {
    if (plot.state !== "growing") return;
    plot.progress += 250;
    const t = Math.min(plot.progress / plot.type.growMs, 1);
    const { stem, fruit } = plot.plantMesh.userData;
    stem.scale.y = 0.05 + t * 0.95; // stem stretches up as it grows
    stem.position.y = stem.scale.y * 0.5;
    if (t > 0.5) {
      const fruitT = (t - 0.5) / 0.5;
      fruit.scale.setScalar(0.001 + fruitT); // fruit pops in during the second half
      fruit.position.y = stem.scale.y * 1.05;
    }
    if (t >= 1) plot.state = "ready";
  });
}, 250);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Tap/click a house: raycast to find it, walk the player toward it.
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function onTap(clientX, clientY) {
  pointer.x = (clientX / innerWidth) * 2 - 1;
  pointer.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(scene.children, true);
  for (const hit of hits) {
    let obj = hit.object;
    while (obj && !obj.userData.isHouse) obj = obj.parent;
    if (obj) {
      playerTarget = new THREE.Vector3(obj.position.x, 0, obj.position.z + 2);
      pendingHouse = obj;
      panelEl.classList.remove("open");
      return;
    }
  }
  // No house hit — check if an NPC was tapped.
  for (const hit of hits) {
    let obj = hit.object;
    while (obj && !obj.userData.isNpc) obj = obj.parent;
    if (obj) {
      playerTarget = new THREE.Vector3(obj.position.x, 0, obj.position.z + 1.5);
      panelEl.classList.remove("open");
      setTimeout(() => {
        panelTitle.textContent = "👋 NPC";
        panelContent.innerHTML = "<p style='text-align:center'>" + obj.userData.greeting + "</p>";
        panelEl.classList.add("open");
      }, 700);
      return;
    }
  }
  // No house or NPC hit — check if a soil plot was tapped instead.
  for (const hit of hits) {
    if (hit.object.userData.isPlot) {
      const plot = plots.find((p) => p.mesh === hit.object);
      if (plot) onPlotTap(plot);
      return;
    }
  }
}
// Distinguish a quick tap (interact) from a drag (look around) on the main canvas.
let dragStart = null, dragging = false, camYaw = 0;
const camDistance = 11, camHeight = 9;
renderer.domElement.addEventListener("pointerdown", (e) => {
  dragStart = { x: e.clientX, y: e.clientY, yaw: camYaw };
  dragging = false;
});
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!dragStart) return;
  const dx = e.clientX - dragStart.x;
  if (Math.abs(dx) > 6 || dragging) {
    dragging = true;
    camYaw = dragStart.yaw + dx * 0.005;
  }
});
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!dragging && dragStart) onTap(e.clientX, e.clientY);
  dragStart = null;
  dragging = false;
});

// Free movement: joystick (touch) + arrow keys / WASD (keyboard). Both just set a
// direction vector each frame; tapping a house/plot still works via onTap above.
const keys = {};
addEventListener("keydown", (e) => (keys[e.key.toLowerCase()] = true));
addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = false));

const stick = document.getElementById("stick");
const stickKnob = document.getElementById("stickKnob");
let stickDir = { x: 0, y: 0 };
let stickTouchId = null;
function stickMove(clientX, clientY) {
  const rect = stick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = clientX - cx, dy = clientY - cy;
  const max = rect.width / 2;
  const len = Math.hypot(dx, dy) || 1;
  if (len > max) { dx = (dx / len) * max; dy = (dy / len) * max; }
  stickKnob.style.transform = `translate(${dx - 25}px, ${dy - 25}px)`;
  stickDir = { x: dx / max, y: dy / max };
}
function stickReset() {
  stickTouchId = null;
  stickDir = { x: 0, y: 0 };
  stickKnob.style.transform = "translate(-50%, -50%)";
}
stick.addEventListener("pointerdown", (e) => { stickTouchId = e.pointerId; stickMove(e.clientX, e.clientY); });
stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickTouchId) stickMove(e.clientX, e.clientY); });
addEventListener("pointerup", (e) => { if (e.pointerId === stickTouchId) stickReset(); });

renderer.setAnimationLoop(() => {
  // Keyboard/joystick free movement overrides walking-to-a-house.
  let mx = stickDir.x, my = stickDir.y;
  if (keys["arrowleft"] || keys["a"]) mx = -1;
  if (keys["arrowright"] || keys["d"]) mx = 1;
  if (keys["arrowup"] || keys["w"]) my = -1;
  if (keys["arrowdown"] || keys["s"]) my = 1;
  if (mx !== 0 || my !== 0) {
    pendingHouse = null;
    player.position.x += mx * 0.12;
    player.position.z += my * 0.12;
    playerTarget = player.position.clone();
  } else {
    // Walk the player smoothly toward its target each frame (used by house taps).
    player.position.lerp(playerTarget, 0.06);
  }
  // Once close enough to the house it was walking to, "press" it and open its panel.
  if (pendingHouse && player.position.distanceTo(playerTarget) < 0.05) {
    pressHouse(pendingHouse);
    openPanel(pendingHouse.userData.type);
    pendingHouse = null;
  }
  // Camera orbits around the player at a fixed distance/height, following camYaw from drag input.
  camera.position.set(
    player.position.x + Math.sin(camYaw) * camDistance,
    camHeight,
    player.position.z + Math.cos(camYaw) * camDistance
  );
  camera.lookAt(player.position.x, 1, player.position.z);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
