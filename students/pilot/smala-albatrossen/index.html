<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sushi — Tamagochi</title>
  <style>
    html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
    body{
      -webkit-user-select:none;user-select:none;
      -webkit-touch-callout:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      font-family:system-ui,sans-serif;
      background:linear-gradient(160deg,#ffe4f5 0%,#f5d6ff 100%);
      display:flex;flex-direction:column;
      height:100dvh;overflow:hidden;
      color:#3a1040;
    }

    /* ── Topprad ── */
    #top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px;font-weight:800}
    #cat-name{font-size:1.3rem}
    #age-label{font-size:.78rem;opacity:.6}

    /* ── Pratbubbla ── */
    #bubble-wrap{text-align:center;padding:2px 16px 4px;min-height:42px}
    #speech{
      display:inline-block;background:#fff;border-radius:18px;
      padding:7px 18px;font-size:.88rem;font-weight:600;
      box-shadow:0 3px 0 rgba(0,0,0,.08);position:relative;
      transition:opacity .3s;
    }
    #speech::after{
      content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
      border:5px solid transparent;border-top-color:#fff;
    }

    /* ── Katt-SVG ── */
    #cat-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
    #cat{width:min(240px,62vw);height:auto;filter:drop-shadow(0 8px 18px rgba(180,60,200,.22))}

    @keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(9deg)}70%{transform:rotate(-9deg)}}
    @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .anim-happy{animation:hop .5s ease-in-out,wiggle .5s .1s ease-in-out}
    .anim-sad  {animation:shake .4s ease-in-out}

    /* Äta: katten nickar och tuggar */
    @keyframes nom{
      0%,100%{transform:translateY(0) rotate(0)}
      20%    {transform:translateY(-8px) rotate(-6deg)}
      40%    {transform:translateY(4px) rotate(4deg)}
      60%    {transform:translateY(-6px) rotate(-4deg)}
      80%    {transform:translateY(2px) rotate(2deg)}
    }
    .anim-eat{animation:nom .9s ease-in-out}

    /* Leka: studsar upp och ner med snurr */
    @keyframes playful{
      0%,100%{transform:translateY(0) rotate(0) scale(1)}
      15%    {transform:translateY(-20px) rotate(-10deg) scale(1.05)}
      35%    {transform:translateY(-10px) rotate(8deg) scale(1.04)}
      55%    {transform:translateY(-18px) rotate(-7deg) scale(1.05)}
      75%    {transform:translateY(-6px) rotate(5deg) scale(1.02)}
    }
    .anim-play{animation:playful .85s ease-in-out}

    /* Kela: katten skakar på svansen (skälver av lycka) */
    @keyframes purr{
      0%,100%{transform:rotate(0) scale(1)}
      25%    {transform:rotate(3deg) scale(1.04)}
      50%    {transform:rotate(-3deg) scale(1.04)}
      75%    {transform:rotate(2deg) scale(1.03)}
    }
    .anim-pet{animation:purr .6s ease-in-out 2}

    /* Flytande emoji (mat, hjärtan, boll) som flyger upp och försvinner */
    @keyframes floatup{
      0%  {transform:translateY(0) scale(1);  opacity:1}
      100%{transform:translateY(-70px) scale(.5); opacity:0}
    }
    .floater{
      position:absolute;
      pointer-events:none;z-index:20;
      animation:floatup .9s ease-out forwards;
    }

    /* Fisken simmar rakt in mot munnen och försvinner */
    @keyframes fish-to-mouth {
      0%   { transform: translate(0,0)        scale(1);   opacity:1; }
      55%  { transform: translate(-100px,-18px) scale(1);   opacity:1; }
      80%  { transform: translate(-130px,-10px) scale(.4);  opacity:.8; }
      100% { transform: translate(-148px, -5px) scale(0);   opacity:0; }
    }
    .fish-swim { animation: fish-to-mouth .85s ease-in forwards; }

    /* Nystanen studsar runt */
    @keyframes yarn-bounce {
      0%   { transform: translate(0,0)        rotate(0deg);  }
      20%  { transform: translate(-40px,-55px)  rotate(130deg); }
      40%  { transform: translate( 25px,-80px)  rotate(270deg); }
      58%  { transform: translate( 55px,-42px)  rotate(400deg); }
      75%  { transform: translate( 10px,-65px)  rotate(540deg); }
      90%  { transform: translate(-28px,-28px)  rotate(650deg); }
      100% { transform: translate(0,0)        rotate(720deg); }
    }
    .yarn-play { animation: yarn-bounce 1.1s ease-in-out forwards; }

    /* Tassen sveper ut och drar sig tillbaka */
    @keyframes paw-swipe {
      0%   { opacity:0; transform:translate(0,0)        rotate(0deg);   }
      15%  { opacity:1; transform:translate(0,0)        rotate(0deg);   }
      42%  { opacity:1; transform:translate(-58px,-48px)  rotate(-32deg); }
      68%  { opacity:1; transform:translate(-28px,-18px)  rotate(-14deg); }
      88%  { opacity:.4; }
      100% { opacity:0; transform:translate(0,0)        rotate(0deg);   }
    }
    #cat-paw { transform-box: fill-box; transform-origin: 155px 178px; }
    #cat-paw.swiping { animation: paw-swipe .9s ease-in-out forwards; }

    /* ── Mätare ── */
    #stats{padding:0 18px 6px;display:flex;flex-direction:column;gap:5px}
    .stat-row{display:flex;align-items:center;gap:9px}
    .stat-icon{font-size:1rem;width:24px;text-align:center}
    .bar-bg{flex:1;height:13px;background:rgba(0,0,0,.1);border-radius:999px;overflow:hidden}
    .bar-fill{height:100%;border-radius:999px;transition:width .5s ease,background .5s}
    #bar-food  {background:#ff8c42}
    #bar-mood  {background:#ff5cac}
    #bar-energy{background:#60b8ff}

    /* Pulsar rött när värdet är lågt */
    .stat-low .bar-fill{animation:pulse 1s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    /* ── Knappar ── */
    #actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 12px 16px}
    .act{
      background:#fff;border:3px solid #e4b0f8;border-radius:16px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:9px 4px 7px;gap:2px;cursor:pointer;
      box-shadow:0 4px 0 #d8a0ec;
      transition:transform 80ms,box-shadow 80ms;
      font-size:1.55rem;
    }
    .act span{font-size:.6rem;font-weight:800;color:#7a3a8a}
    .act:active{transform:translateY(4px);box-shadow:0 0 0 transparent}
    .act.sleeping-btn{background:#e8f4ff;border-color:#90c8f8;box-shadow:0 4px 0 #78b0e8}

    /* ── Game-over-skärm ── */
    #overlay{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);
      flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:99;
    }
    #overlay.show{display:flex}
    #overlay p{color:#fff;font-size:1.3rem;font-weight:900;text-align:center;margin:0}
    #restart{
      background:#ff5cac;color:#fff;border:none;border-radius:24px;
      padding:13px 34px;font-size:1rem;font-weight:800;cursor:pointer;
      box-shadow:0 4px 0 #c0308a;
    }
    #restart:active{transform:translateY(4px);box-shadow:0 0 0 transparent}
  </style>
</head>
<body>

<div id="top-bar">
  <span id="cat-name">🐱 Sushi</span>
  <span id="age-label">Ålder: 0 dagar</span>
</div>

<div id="bubble-wrap">
  <div id="speech">Mjau! Jag är glad! 😄</div>
</div>

<!-- Katten är ett SVG som JavaScript byter ut ansiktsdelar på -->
<div id="cat-wrap">
<svg id="cat" viewBox="0 0 200 230" fill="none">
  <!-- Kropp — orange -->
  <ellipse cx="100" cy="192" rx="54" ry="37" fill="#ff9933"/>
  <!-- Mage — vit fläck -->
  <ellipse cx="100" cy="196" rx="34" ry="23" fill="#fff8f0"/>
  <!-- Svans — orange -->
  <path d="M148 196 Q186 162 174 128 Q166 108 152 124" stroke="#ff9933" stroke-width="13" stroke-linecap="round"/>
  <!-- Huvud — ljus orange/kräm -->
  <circle cx="100" cy="105" r="64" fill="#ffcc88"/>
  <!-- Vit ansiktsmitt -->
  <ellipse cx="100" cy="118" rx="36" ry="30" fill="#fff8f0"/>
  <!-- Öron — mörkare orange ytter, varmt inre -->
  <polygon points="46,56 32,10 70,40"  fill="#ff9933"/>
  <polygon points="154,56 168,10 130,40" fill="#ff9933"/>
  <polygon points="49,50 40,20 65,42"  fill="#ff6622"/>
  <polygon points="151,50 160,20 135,42" fill="#ff6622"/>
  <!-- Kindrosor -->
  <ellipse cx="65"  cy="122" rx="12" ry="7" fill="#ffaa55" opacity=".45"/>
  <ellipse cx="135" cy="122" rx="12" ry="7" fill="#ffaa55" opacity=".45"/>
  <!-- Nos -->
  <polygon points="100,118 94,125 106,125" fill="#ff88bb"/>
  <!-- Morrhår -->
  <g stroke="#3a1040" stroke-width="1.8" stroke-linecap="round" opacity=".4">
    <line x1="38" y1="117" x2="80" y2="117"/>
    <line x1="38" y1="123" x2="80" y2="121"/>
    <line x1="38" y1="129" x2="80" y2="125"/>
    <line x1="162" y1="117" x2="120" y2="117"/>
    <line x1="162" y1="123" x2="120" y2="121"/>
    <line x1="162" y1="129" x2="120" y2="125"/>
  </g>
  <!-- Tass — gömd normalt, animeras under lek -->
  <g id="cat-paw" style="opacity:0; transform-origin: 155px 170px;">
    <!-- Handlov -->
    <ellipse cx="155" cy="178" rx="20" ry="13" fill="#ffcc88"/>
    <!-- Tåkuddar -->
    <ellipse cx="142" cy="165" rx="7" ry="6" fill="#ffcc88"/>
    <ellipse cx="155" cy="161" rx="7" ry="6" fill="#ffcc88"/>
    <ellipse cx="168" cy="165" rx="7" ry="6" fill="#ffcc88"/>
    <!-- Rosa klotsar -->
    <ellipse cx="155" cy="176" rx="10" ry="7" fill="#ffaacc" opacity=".7"/>
    <ellipse cx="142" cy="164" rx="4"  ry="3" fill="#ffaacc" opacity=".6"/>
    <ellipse cx="155" cy="160" rx="4"  ry="3" fill="#ffaacc" opacity=".6"/>
    <ellipse cx="168" cy="164" rx="4"  ry="3" fill="#ffaacc" opacity=".6"/>
  </g>

  <!-- Ögon — byts ut av JS -->
  <g id="eyes">
    <circle cx="78"  cy="100" r="12" fill="white"/>
    <circle cx="122" cy="100" r="12" fill="white"/>
    <circle cx="78"  cy="102" r="7"  fill="#3a1040"/>
    <circle cx="122" cy="102" r="7"  fill="#3a1040"/>
    <circle cx="81"  cy="99"  r="2.5" fill="white"/>
    <circle cx="125" cy="99"  r="2.5" fill="white"/>
  </g>
  <!-- Mun — byts ut av JS -->
  <g id="mouth">
    <path d="M100 125 Q89 136 83 132" stroke="#3a1040" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M100 125 Q111 136 117 132" stroke="#3a1040" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
</div>

<!-- Mätare med ritade SVG-ikoner -->
<div id="stats">

  <div class="stat-row" id="row-food">
    <!-- Liten fisk-ikon -->
    <svg class="stat-icon" viewBox="0 0 28 18" width="28" height="18">
      <polygon points="21,9 28,4 28,14" fill="#ff5511"/>
      <ellipse cx="12" cy="9" rx="12" ry="7" fill="#ff7733"/>
      <circle cx="5" cy="7" r="2" fill="white"/>
      <circle cx="5" cy="7" r="1" fill="#222"/>
    </svg>
    <div class="bar-bg"><div class="bar-fill" id="bar-food" style="width:80%"></div></div>
  </div>

  <div class="stat-row" id="row-mood">
    <!-- Litet hjärta -->
    <svg class="stat-icon" viewBox="0 0 24 22" width="24" height="22">
      <path d="M12 20 C12 20 2 13 2 7 C2 3.5 5 1.5 8.5 3.5 C10 4.5 11 7 12 7
               C13 7 14 4.5 15.5 3.5 C19 1.5 22 3.5 22 7 C22 13 12 20 12 20Z"
            fill="#ff3366"/>
    </svg>
    <div class="bar-bg"><div class="bar-fill" id="bar-mood" style="width:80%"></div></div>
  </div>

  <div class="stat-row" id="row-energy">
    <!-- Liten måne -->
    <svg class="stat-icon" viewBox="0 0 22 24" width="22" height="24">
      <path d="M15 3 A9 9 0 1 0 15 21 A7 7 0 1 1 15 3Z" fill="#aaccff"/>
    </svg>
    <div class="bar-bg"><div class="bar-fill" id="bar-energy" style="width:80%"></div></div>
  </div>

</div>

<!-- Åtgärdsknappar med ritade SVG-ikoner -->
<div id="actions">

  <button class="act" id="btn-feed" onclick="act('feed')">
    <!-- Fisk -->
    <svg viewBox="0 0 38 24" width="38" height="24">
      <polygon points="28,12 38,5 38,19" fill="#ff5511"/>
      <ellipse cx="17" cy="12" rx="16" ry="10" fill="#ff7733"/>
      <ellipse cx="11" cy="12" rx="9"  ry="6"  fill="#ffaa55" opacity=".5"/>
      <circle cx="7" cy="9" r="2.5" fill="white"/>
      <circle cx="7" cy="9" r="1.2" fill="#222"/>
    </svg>
    <span>Mata</span>
  </button>

  <button class="act" id="btn-play" onclick="act('play')">
    <!-- Nystan -->
    <svg viewBox="0 0 36 36" width="36" height="36">
      <circle cx="18" cy="18" r="14" fill="#ff88cc"/>
      <circle cx="18" cy="18" r="14" fill="none" stroke="#cc2299" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d="M6 12 Q18 8 30 14" stroke="#cc2299" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M4 19 Q18 14 32 20" stroke="#cc2299" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M6 26 Q18 21 30 27" stroke="#cc2299" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <span>Lek</span>
  </button>

  <button class="act" id="btn-sleep" onclick="act('sleep')">
    <!-- Måne + z:n -->
    <svg viewBox="0 0 36 36" width="36" height="36">
      <path d="M22 6 A12 12 0 1 0 22 30 A9 9 0 1 1 22 6Z" fill="#aaccff"/>
      <text x="24" y="16" font-size="9" fill="#6688cc" font-weight="bold">z</text>
      <text x="27" y="11" font-size="7" fill="#6688cc" font-weight="bold">z</text>
    </svg>
    <span>Sov</span>
  </button>

  <button class="act" id="btn-pet" onclick="act('pet')">
    <!-- Hjärta med liten tass -->
    <svg viewBox="0 0 36 34" width="36" height="34">
      <path d="M18 30 C18 30 4 20 4 11 C4 6 8 3 13 5.5 C15.5 7 17 10 18 10
               C19 10 20.5 7 23 5.5 C28 3 32 6 32 11 C32 20 18 30 18 30Z"
            fill="#ff3366"/>
      <path d="M18 26 C18 26 8 18 8 12 C8 9.5 11 8 13 9.5"
            stroke="#ff88aa" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".6"/>
    </svg>
    <span>Kela</span>
  </button>

</div>

<!-- Spelslut -->
<div id="overlay">
  <p>😢 Sushi är borta…<br><small style="font-weight:400;font-size:.9rem">Passa bättre på henne nästa gång!</small></p>
  <button id="restart" onclick="restart()">Försök igen</button>
</div>

<script>
  // ── Speldata ─────────────────────────────────────────────────────────
  let s = { food:80, mood:80, energy:80 }; // stats 0–100
  let age = 0, sleeping = false, dead = false;

  // ── SVG-former för flytande föremål ─────────────────────────────────
  const SVGSHAPES = {
    // En liten orange fisk
    fish: `<svg viewBox="0 0 46 28" width="46" height="28">
      <polygon points="33,14 46,5 46,23" fill="#ff5511"/>
      <ellipse cx="20" cy="14" rx="19" ry="11" fill="#ff7733"/>
      <ellipse cx="14" cy="14" rx="11" ry="7" fill="#ffaa55" opacity=".55"/>
      <circle cx="9" cy="11" r="3" fill="white"/>
      <circle cx="9" cy="11" r="1.5" fill="#222"/>
      <path d="M26 9 Q32 14 26 19" stroke="#ff4400" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>`,
    // Ett rosa nystan
    yarn: `<svg viewBox="0 0 40 40" width="40" height="40">
      <circle cx="20" cy="20" r="16" fill="#ff88cc"/>
      <circle cx="20" cy="20" r="16" fill="none" stroke="#dd44aa" stroke-width="1.5" stroke-dasharray="5 3"/>
      <path d="M6 14 Q20 9 34 16" stroke="#cc2299" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M4 21 Q20 15 36 22" stroke="#cc2299" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M6 28 Q20 22 34 29" stroke="#cc2299" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="4" fill="#ee66bb"/>
    </svg>`,
    // Ett rött hjärta
    heart: `<svg viewBox="0 0 36 32" width="36" height="32">
      <path d="M18 28 C18 28 3 18 3 10 C3 5 7 2 12 4.5 C14.5 6 16 9 18 9
               C20 9 21.5 6 24 4.5 C29 2 33 5 33 10 C33 18 18 28 18 28Z"
            fill="#ff3366"/>
      <path d="M18 24 C18 24 7 16 7 11 C7 8.5 10 7 12 8.5"
            stroke="#ff88aa" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".65"/>
    </svg>`,
    // En gul stjärna
    star: `<svg viewBox="0 0 34 34" width="34" height="34">
      <polygon points="17,3 20.5,12 30,12.5 22.5,19 25,28.5 17,23 9,28.5 11.5,19 4,12.5 13.5,12"
               fill="#ffdd22" stroke="#ffaa00" stroke-width="1" stroke-linejoin="round"/>
    </svg>`,
  };

  // ── Flytande SVG-föremål som flyger upp ur katten ────────────────────
  function floater(items, spread) {
    const wrap = document.getElementById('cat-wrap');
    wrap.style.position = 'relative';
    items.forEach((key, i) => {
      const el = document.createElement('div');
      el.className = 'floater';
      el.innerHTML = SVGSHAPES[key] || key;  // SVG-form om den finns, annars texten
      const xBase = spread === 'left' ? 18 : spread === 'right' ? 68 : 46;
      el.style.left   = (xBase + (i - Math.floor(items.length / 2)) * 18) + '%';
      el.style.bottom = '36%';
      el.style.animationDelay = (i * 130) + 'ms';
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 1100);
    });
  }

  // ── Ansiktsuttryck ────────────────────────────────────────────────────
  const FACE = {
    happy: {
      eyes: `<circle cx="78" cy="100" r="12" fill="white"/>
             <circle cx="122" cy="100" r="12" fill="white"/>
             <circle cx="78" cy="102" r="7" fill="#3a1040"/>
             <circle cx="122" cy="102" r="7" fill="#3a1040"/>
             <circle cx="81" cy="99" r="2.5" fill="white"/>
             <circle cx="125" cy="99" r="2.5" fill="white"/>`,
      mouth:`<path d="M100 125 Q89 137 83 132" stroke="#3a1040" stroke-width="2.5" stroke-linecap="round"/>
             <path d="M100 125 Q111 137 117 132" stroke="#3a1040" stroke-width="2.5" stroke-linecap="round"/>`
    },
    sad: {
      eyes: `<circle cx="78" cy="103" r="11" fill="white"/>
             <circle cx="122" cy="103" r="11" fill="white"/>
             <circle cx="78" cy="105" r="6" fill="#3a1040"/>
             <circle cx="122" cy="105" r="6" fill="#3a1040"/>`,
      mouth:`<path d="M84 136 Q100 128 116 136" stroke="#3a1040" stroke-width="2.5" stroke-linecap="round"/>`
    },
    sleeping: {
      eyes: `<path d="M66 100 Q78 110 90 100" stroke="#3a1040" stroke-width="3" stroke-linecap="round"/>
             <path d="M110 100 Q122 110 134 100" stroke="#3a1040" stroke-width="3" stroke-linecap="round"/>
             <text x="110" y="86" font-size="15" fill="#3a1040" opacity=".5">z</text>
             <text x="123" y="73" font-size="11" fill="#3a1040" opacity=".35">z</text>`,
      mouth:`<path d="M93 130 Q100 134 107 130" stroke="#3a1040" stroke-width="2" stroke-linecap="round"/>`
    },
    sick: {
      eyes: `<text x="66" y="110" font-size="20" fill="#3a1040">×</text>
             <text x="110" y="110" font-size="20" fill="#3a1040">×</text>`,
      mouth:`<path d="M87 133 Q100 128 113 133" stroke="#3a1040" stroke-width="2.5" stroke-linecap="round"/>`
    },
    // Öppen mun när katten äter — ett runt O
    eating: {
      eyes: `<circle cx="78" cy="100" r="12" fill="white"/>
             <circle cx="122" cy="100" r="12" fill="white"/>
             <circle cx="78" cy="102" r="7" fill="#3a1040"/>
             <circle cx="122" cy="102" r="7" fill="#3a1040"/>
             <circle cx="81" cy="99" r="2.5" fill="white"/>
             <circle cx="125" cy="99" r="2.5" fill="white"/>`,
      mouth:`<ellipse cx="100" cy="131" rx="11" ry="9" fill="#3a1040" opacity=".85"/>
             <ellipse cx="100" cy="131" rx="7"  ry="5" fill="#cc3366" opacity=".7"/>`
    },
  };

  // Humör beräknas från stats
  function mood() {
    if (dead)          return 'sick';
    if (sleeping)      return 'sleeping';
    if (s.food<20 || s.energy<20) return 'sick';
    if (s.mood<40 || s.food<40)   return 'sad';
    return 'happy';
  }

  // Meddelanden per humör
  const MSGS = {
    happy:   ['Mjau! Jag är glad! 😄','Purrr… ♥','Kela mig!','Livet är gott!'],
    sad:     ['Jag är ledsen 😢','Leka med mig!','Glöm inte mig!'],
    sleeping:['Zzzz… 💤','*sover*','Snarka snarka…'],
    sick:    ['Mår inte bra… 🤒','Hjälp mig!','Auu…'],
  };
  let lastMsg = '';

  // ── Uppdatera allt på skärmen ─────────────────────────────────────────
  function draw() {
    // Mätare
    ['food','mood','energy'].forEach(k => {
      document.getElementById('bar-'+k).style.width = Math.max(0,s[k]) + '%';
      document.getElementById('row-'+k).classList.toggle('stat-low', s[k] < 25);
    });
    // Ansikte
    const m = mood();
    const f = FACE[m] || FACE.happy;
    document.getElementById('eyes').innerHTML  = f.eyes;
    document.getElementById('mouth').innerHTML = f.mouth;
    // Pratbubbla — byt meddelande en gång i taget
    const list = MSGS[m] || MSGS.happy;
    const msg  = list[Math.floor(Math.random() * list.length)];
    if (msg !== lastMsg) { document.getElementById('speech').textContent = msg; lastMsg = msg; }
    // Ålder
    document.getElementById('age-label').textContent = `Ålder: ${Math.floor(age/60)} dagar`;
  }

  // ── Spelarens knapptryck ──────────────────────────────────────────────
  function act(type) {
    if (dead) return;

    if (type === 'sleep') {
      sleeping = !sleeping;
      const btn = document.getElementById('btn-sleep');
      btn.innerHTML = sleeping
        ? `<svg viewBox="0 0 36 36" width="36" height="36"><circle cx="18" cy="18" r="13" fill="#FFD93D"/><g stroke="#FFD93D" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="2" x2="18" y2="7"/><line x1="18" y1="29" x2="18" y2="34"/><line x1="2" y1="18" x2="7" y2="18"/><line x1="29" y1="18" x2="34" y2="18"/><line x1="6" y1="6" x2="10" y2="10"/><line x1="26" y1="26" x2="30" y2="30"/><line x1="30" y1="6" x2="26" y2="10"/><line x1="10" y1="26" x2="6" y2="30"/></g></svg><span>Vakna</span>`
        : `<svg viewBox="0 0 36 36" width="36" height="36"><path d="M22 6 A12 12 0 1 0 22 30 A9 9 0 1 1 22 6Z" fill="#aaccff"/><text x="24" y="16" font-size="9" fill="#6688cc" font-weight="bold">z</text><text x="27" y="11" font-size="7" fill="#6688cc" font-weight="bold">z</text></svg><span>Sov</span>`;
      btn.classList.toggle('sleeping-btn', sleeping);
      draw();
      return;
    }

    // Vakna om katten sover
    if (sleeping) {
      sleeping = false;
      document.getElementById('btn-sleep').innerHTML = `<svg viewBox="0 0 36 36" width="36" height="36"><path d="M22 6 A12 12 0 1 0 22 30 A9 9 0 1 1 22 6Z" fill="#aaccff"/><text x="24" y="16" font-size="9" fill="#6688cc" font-weight="bold">z</text><text x="27" y="11" font-size="7" fill="#6688cc" font-weight="bold">z</text></svg><span>Sov</span>`;
      document.getElementById('btn-sleep').classList.remove('sleeping-btn');
    }

    if (type === 'feed') {
      s.food = Math.min(100, s.food + 25);
      doEating();
    }

    if (type === 'play') {
      s.mood   = Math.min(100, s.mood   + 22);
      s.energy = Math.max(0,   s.energy - 12);
      doPlaying();
    }

    if (type === 'pet') {
      s.mood = Math.min(100, s.mood + 15);
      floater(['heart','star','heart'], 'center');
      playAnim('pet');
    }

    draw();
  }

  // ── Äta: fisken simmar in, munnen tuggar ────────────────────────────
  function doEating() {
    const wrap = document.getElementById('cat-wrap');
    wrap.style.position = 'relative';

    // Placera fisken till höger om katten, låt den simma in mot munnen
    const fishEl = document.createElement('div');
    fishEl.className = 'fish-swim';
    fishEl.style.cssText = 'position:absolute;right:6%;bottom:40%;z-index:20;';
    fishEl.innerHTML = SVGSHAPES.fish;
    wrap.appendChild(fishEl);
    setTimeout(() => fishEl.remove(), 900);

    // Visa ätande ögon
    document.getElementById('eyes').innerHTML = FACE.eating.eyes;

    // Munnens tugg-cykel: öppen → stängd × 3 gånger
    const openMouth  = `<ellipse cx="100" cy="131" rx="11" ry="9" fill="#3a1040" opacity=".85"/>
                        <ellipse cx="100" cy="131" rx="7"  ry="5" fill="#aa2255" opacity=".7"/>`;
    const closedMouth = `<path d="M92 128 Q100 133 108 128" stroke="#3a1040" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;

    let chew = 0;
    const chewTimer = setInterval(() => {
      document.getElementById('mouth').innerHTML = (chew % 2 === 0) ? openMouth : closedMouth;
      chew++;
      if (chew >= 6) { clearInterval(chewTimer); draw(); } // återställ ansiktet
    }, 160);

    // Katten nickar lite medan den tuggar
    playAnim('eat');
  }

  // ── Leka: nystanen studsar runt, tassen svingar ──────────────────────
  function doPlaying() {
    const wrap = document.getElementById('cat-wrap');
    wrap.style.position = 'relative';

    // Nystan som studsar runt
    const yarnEl = document.createElement('div');
    yarnEl.className = 'yarn-play';
    yarnEl.style.cssText = 'position:absolute;left:30%;bottom:36%;z-index:20;';
    yarnEl.innerHTML = SVGSHAPES.yarn;
    wrap.appendChild(yarnEl);

    // Tassen svingar
    const paw = document.getElementById('cat-paw');
    paw.style.opacity = '1';
    paw.classList.remove('swiping');
    void paw.getBoundingClientRect(); // tvinga reflow
    paw.classList.add('swiping');

    setTimeout(() => {
      yarnEl.remove();
      paw.style.opacity = '0';
      paw.classList.remove('swiping');
    }, 1150);

    playAnim('play');
  }

  // Startar en CSS-animation på katt-SVG:n (tar bort den igen efteråt)
  function playAnim(name) {
    const cat = document.getElementById('cat');
    cat.classList.remove('anim-eat','anim-play','anim-pet','anim-happy','anim-sad');
    void cat.offsetWidth; // tvinga reflow så animationen startar om
    cat.classList.add('anim-' + name);
    cat.addEventListener('animationend', () => cat.classList.remove('anim-' + name), { once: true });
  }

  // ── Spel-loop — körs varje sekund ─────────────────────────────────────
  setInterval(() => {
    if (dead) return;
    age++;
    if (sleeping) {
      s.energy = Math.min(100, s.energy + 3);
      s.food   = Math.max(0,   s.food   - 0.4);
      s.mood   = Math.max(0,   s.mood   - 0.3);
    } else {
      s.food   = Math.max(0, s.food   - 1.4);
      s.mood   = Math.max(0, s.mood   - 0.9);
      s.energy = Math.max(0, s.energy - 0.7);
    }
    if (s.food <= 0 || s.energy <= 0) {
      dead = true;
      document.getElementById('overlay').classList.add('show');
    }
    draw();
  }, 1000);

  // ── Börja om ─────────────────────────────────────────────────────────
  function restart() {
    s = {food:80,mood:80,energy:80};
    age = 0; sleeping = false; dead = false;
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('btn-sleep').innerHTML = `<svg viewBox="0 0 36 36" width="36" height="36"><path d="M22 6 A12 12 0 1 0 22 30 A9 9 0 1 1 22 6Z" fill="#aaccff"/><text x="24" y="16" font-size="9" fill="#6688cc" font-weight="bold">z</text><text x="27" y="11" font-size="7" fill="#6688cc" font-weight="bold">z</text></svg><span>Sov</span>`;
    document.getElementById('btn-sleep').classList.remove('sleeping-btn');
    draw();
  }

  draw(); // starta
</script>
</body>
</html>
