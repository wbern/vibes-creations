<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>min sida</title>
  <!-- pilot-port209e46 -->
  <style>
    html, body { margin: 0; min-height: 100vh; -webkit-text-size-adjust: 100%; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #ffd86b 0%, #ff9ec4 100%);
      display: grid;
      place-items: center;
      padding: 2rem;
      box-sizing: border-box;
      color: #222;
    }
    main { text-align: center; max-width: 36rem; }
    h1 { font-size: 3rem; margin: 0 0 .25rem; line-height: 1.1; }
    h1 .wave {
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 1.6s infinite;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(20deg); }
      75% { transform: rotate(-10deg); }
    }
    .lead { font-size: 1.2rem; margin: .75rem 0 1.25rem; }
    .prompts-label { margin: 0 0 .75rem; font-size: 1rem; opacity: .8; }
    .prompts {
      display: flex;
      flex-direction: column;
      gap: .65rem;
      background: rgba(255, 255, 255, 0.55);
      padding: 1rem 1.25rem;
      border-radius: 14px;
      text-align: left;
    }
    .prompt { display: flex; align-items: center; gap: .85rem; }
    .pic { font-size: 1.8rem; flex-shrink: 0; width: 2.5rem; text-align: center; line-height: 1; }
    code {
      background: rgba(0, 0, 0, 0.08);
      padding: .2rem .5rem;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: .95rem;
      line-height: 1.4;
    }
    footer { margin-top: 1.5rem; opacity: 0.55; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>vad ska stå här? <span class="wave">👋</span></h1>
    <p class="lead">det här är <b>din</b> sida. du bestämmer.</p>
    <p class="prompts-label">säg till Claude:</p>
    <div class="prompts">
      <div class="prompt"><span class="pic" aria-hidden="true">🐶</span><code>skriv mitt favoritdjur högst upp</code></div>
      <div class="prompt"><span class="pic" aria-hidden="true">🎨</span><code>byt bakgrundsfärgen till lila</code></div>
      <div class="prompt"><span class="pic" aria-hidden="true">🎉</span><code>lägg till en knapp som säger nåt roligt</code></div>
    </div>
    <footer>byggd av dig + Claude</footer>
  </main>
</body>
</html>
